  - type: step-flow
    title: How to apply and use our EverChek CGM?
    text: Three simple steps to get started — apply, pair, and monitor glucose data in real time on your smartphone.
    columns: 3
    arrows: true
    center: true
    tint: true
    items:
      - icon: patch
        title: "Step 1: Apply"
        desc: After cleaning your skin, remove the lower cover of the EverChek CGM and place the applicator firmly and vertically on your arm. When you hear a click, the sensor has been successfully applied.
      - icon: phone
        title: "Step 2: Pair & warm-up"
        desc: Download the EverChek app, scan the QR code, and complete Bluetooth pairing. Wait 1 hour for the sensor warm-up to complete before readings begin.
      - icon: curve
        title: "Step 3: Monitor"
        desc: View real-time glucose data on your phone and receive high/low alerts. Log daily activities such as diet and exercise and gain clearer insights into your glucose patterns. Remove the transmitter after 14 days.

