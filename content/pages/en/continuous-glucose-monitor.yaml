  - type: faq
    title: Frequently asked questions
    items:
      - q: What is a CGM monitor?
        a: CGM stands for Continuous Glucose Monitor. Designed for diabetes management, it is a wearable medical device that continuously measures glucose levels in interstitial fluid. It provides real-time glucose trends for both patients and healthcare providers, beyond single-point measurements.
      - q: Do EverChek CGM monitors hurt?
        a: Most users report minimal or no pain. This is because our sensor is inserted using a fast application system, taking merely 0.2 milliseconds.
      - q: How accurate are EverChek CGM monitors?
        a: >-
          Accuracy is characterised by MARD (Mean Absolute Relative Difference) against a laboratory
          reference. Our clinical performance summary — study design, reference method, sample size
          and segmented results — is released to qualified partners under a mutual NDA, in the form
          your notified body or health authority will expect.
      - q: Is EverChek invasive or non-invasive?
        a: It is minimally invasive. A thin sensor filament is inserted just under the skin and can be worn for up to 14 days. The device is coin-sized and lightweight, designed for stable daily wear with minimal sensation.
      - q: How's the CE certification progress of your CGM?
        a: We are currently in the process of obtaining CE certification. For SKD partners, we can also provide technical documentation and support for local regulatory applications. Please feel free to contact us to discuss your project!
      - q: What is your minimum order quantity (MOQ)?
        a: Since we develop and manufacture our CGM systems in-house, we're very flexible in cooperation and have no fixed MOQ. For any order size or business need, we can accommodate. Just reach out and let's see how we can support you.
      - q: What does CGM measure?
        a: CGM measures glucose levels in the interstitial fluid under the skin, rather than directly from blood. The main advantage is that it provides continuous, real-time glucose readings 24/7. This helps users understand how their glucose changes over time, especially after meals, exercise, and daily activities, also assists in better treatment decisions.
      - q: What data can be viewed in the app?
        a: Users can view real-time glucose levels, historical trends, input daily activities, and receive alert notifications and glucose predictions.
      - q: Can CGM replace fingerstick testing?
        a: CGM provides continuous glucose trend data, but fingerstick testing may still be needed in certain situations, such as when your symptoms do not match the glucose readings. However, CGMs can greatly reduce the overall need for fingerstick testing.
      - q: How long does the sensor last?
        a: The sensor is designed for up to 14 days of continuous use.
      - q: Can CGM be used in clinical settings?
        a: Yes. It is suitable for both clinical monitoring and outpatient diabetes management programs. We also offer a dedicated physician app and can adapt our system to different clinical requirements. Contact us to discuss hospital or clinical glucose monitoring needs.
      - q: Where is the sensor applied?
        a: The sensor is typically applied to the back of the upper arm, between the biceps and triceps. This area helps reduce the impact of muscle movement and supports stable, consistent readings during daily activities.
      - q: Can I customize the product or software?
        a: Surely. We can customize both the product and software based on your specific requirements. Please send us a message so we can discuss your project in detail.
      - q: Can I customize the CGM under my own brand?
        a: Yes. We support SKD, OEM and many other partnership models. Contact us and let's talk!
      - q: How often is glucose reading updated?
        a: Glucose data is updated every 5 minutes and transmitted to the app in real time.
      - q: How reliable is the sensor performance over 14 days?
        a: The sensor is designed to maintain stable performance throughout the full wear period under normal usage conditions.
      - q: What alerts does the system provide?
        a: The system provides configurable high and low glucose alerts, as well as trend-based predictions, to help users respond in time.

