    title: EverChek continuous glucose monitoring system
    sub: Focused exclusively on B2B partnerships, we develop reliable continuous glucose monitoring (CGM) solutions for all types of healthcare providers worldwide. Flexible and cost-efficient, our OEM/SKD models are designed to support and scale your CGM business.
    buttons:
      - label: Contact us
        href: /contact/
        style: primary
    note: |
      Note: This product is designed for continuous or periodic monitoring of glucose levels in the
      interstitial fluid of patients with diabetes. It has been tested in adult patients (18 years and
      older) only. Commercialization in pediatric, pregnant, or other special populations may require
      additional local trials per regional regulations.
