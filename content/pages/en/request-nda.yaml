title: Request an NDA | EverChek
description: Start a mutual NDA with EverChek to receive CGM certificate numbers, test reports and the clinical performance summary for your registration file.
path: /request-nda/
translationKey: request-nda
sections:
  - type: hero
    variant: standard
    kicker: Two pages · Mutual · Counter-signed within one China business day
    title: Request a mutual NDA
    sub: |
      Certificate numbers, test reports, the clinical performance summary and the full technical file are
      released under a mutual non-disclosure agreement — not because they are hard to get, but because
      your registration file needs them and a public web page is the wrong place to publish them.
    buttons:
      - label: See what exists first
        href: /regulatory-dossier-index/
        style: ghost

  - type: text-checks
    title: What an NDA gets you
    text: The NDA is mutual and carries no obligation to buy. It exists so your regulatory affairs team can assess us properly, and so anything you tell us about your market strategy stays with us. We do not ask for a purchase commitment, a volume forecast or an exclusivity discussion at this stage — those go better once your RA team has read the file.
    points:
      - Certificate numbers, issuing bodies, scope statements and validity dates
      - Biological safety, EMC, electrical safety and ingress protection test reports
      - The clinical performance summary, with its reference method and protocol
      - Stability and shelf-life data
      - Product specification sheet and the instructions for use
      - Manufacturer's authorisation letters and declarations of conformity for your market

  - type: step-flow
    columns: 4
    title: How it works
    items:
      - icon: mail
        title: You send this form
        desc: Your entity, your market, and whether you are registering an import, setting up local assembly, or bidding a tender. The document set differs.
      - icon: doc
        title: We send the NDA
        desc: Two pages, mutual, standard terms. If your legal team prefers its own template, send it — we will review yours rather than insist on ours.
      - icon: check
        title: Counter-signed
        desc: Within one China business day (Mon–Fri, UTC+8) of receiving your signature.
      - icon: set
        title: Compiled to your checklist
        desc: Send your regulator's dossier checklist or the tender documents and we work from those, rather than a generic pack you then have to sort through.

  - type: richtext
    title: What we will not do
    blocks:
      - text: We will not send a pack that implies coverage we do not hold. If you ask about a market where we have no registration and no realistic route, we will say so in the first reply rather than in month four. A supplier who claims complete coverage of every jurisdiction is a supplier who has not read the jurisdictions.

  - type: contact-form
