title: Vertically Integrated CGM Manufacturer | EverChek
description: EverChek is a vertically integrated CGM manufacturer in Shenzhen, founded 2016 — in-house sensor chips, biosensors and algorithms, supplied B2B only.
path: /about-us/
translationKey: about-us
sections:
  - type: hero
    variant: split
    visual: image
    kicker: Founded 2016 · Shenzhen · B2B only
    title: A vertically integrated CGM manufacturer from China
    sub: Power your healthcare business with reliable CGM technologies, scalable manufacturing infrastructure, and flexible commercialization models tailored to regional healthcare markets. Start developing reliable glucose monitoring solutions more efficiently.
    image: /images/about-factory.webp
    imageAlt: EverChek manufacturing facility and R&D centre building exterior in Shenzhen
    ratio: 4/3
    buttons:
      - label: Start a partnership conversation
        href: /contact/
        style: primary
      - label: See what documentation we hold
        href: /certifications/
        style: ghost

  - type: image-text
    variant: right
    title: Who are we?
    text: |
      Founded in 2016, we specialize in the research, development, and commercialization of
      electrochemical biosensing technologies and biomolecular signal processing systems. Built on
      self-developed sensor chips, biosensors, and algorithm platforms, we have established integrated
      capabilities spanning from foundational technologies to end-user healthcare products. Our
      infrastructure includes Class 10,000 cleanrooms, biosynthesis laboratories, and medical device
      assembly workshops — all under one roof for integrated in-house R&D and scalable manufacturing.
    image: /images/about-us-facility.webp
    imageAlt: EverChek biosensing technology research and development facility interior
    ratio: 4/3

  - type: richtext
    eyebrow: Positioning
    title: Built exclusively for B2B CGM partnerships
    blocks:
      - heading: Who our continuous glucose monitoring technology is for
        text: |
          Today, our continuous glucose monitoring technologies are built exclusively for OEM, SKD, and
          many other types of healthcare commercialization partnerships across regional healthcare markets
          worldwide. We work with medical device distributors, healthcare brand owners, hospital groups and
          tender agents who need a manufacturer behind their own label rather than a finished consumer
          product to resell.
      - heading: A B2B-only CGM manufacturer, and what that means for your brand
        text: |
          We are a B2B-only CGM manufacturer. We supply OEM, ODM, SKD kit and private-label programmes —
          and we run no consumer brand of our own, so we never compete with yours in your market. The
          brand, the end-user relationship and the market registration strategy stay with our partner.
          That is a structural commitment, not a promise we renew each year.
    tint: true

  - type: image-text
    variant: left
    title: Prof. Xueji Zhang — Chief Scientist and Co-founder
    text: |
      Professor Xueji Zhang is a world-renowned scientist in the field of biosensing and electrochemical
      analysis. With decades of research experience spanning sensor design, biomolecular detection, and
      clinical diagnostics, he has been instrumental in establishing EverChek's core technology platform
      from the ground up. His research bridges fundamental science and practical healthcare applications,
      driving the development of glucose monitoring systems that meet rigorous clinical standards.
    bullets:
      - Fellow of the Royal Society of Chemistry (FRSC)
      - Extensive publication record in top-tier journals on biosensing and electrochemistry
      - Deep expertise in enzyme-based sensor design and clinical diagnostic technologies
      - Led multiple national research programs in biomedical engineering and sensor development
    image: /images/x-zhang-transparent.webp
    imageAlt: Portrait of Professor Xueji Zhang, Chief Scientist and Co-founder of EverChek
    ratio: 1/1

  - type: timeline
    title: Our milestones
    sub: From early-stage biosensor R&D to commercial-scale CGM manufacturing.
    dark: true
    items:
      - time: "2016"
        event: Concept validation
        detail: Founded and started R&D on proprietary sensor chips and biosensors.
      - time: 2017–2019
        event: Pre-product development
        detail: Prof. Xueji Zhang appointed as Chairman & Chief Scientist. Obtained National High-Tech Enterprise certification.
      - time: 2020–2021
        event: Product launch
        detail: Completed first-generation CGM prototype.
      - time: "2022"
        event: System finalization
        detail: CGM system design finalized; cleanroom completed.
      - time: 2023–2024
        event: Commercialization & scale
        detail: CGM automated production line launched. Mass production of CGM achieved. R&D product line fully iterated and achieved scaled sales.

  - type: card-grid
    center: true
    columns: 3
    media: icon
    tint: true
    title: Our core technologies
    text: Six technology pillars built and controlled in house, covering the full journey from sensor chip to finished CGM device.
    items:
      - icon: sensor
        title: Proprietary sensor chips
        text: We design and fabricate our own electrochemical sensor chips in-house. This gives us direct control over signal stability, power consumption, and form factor. It also removes dependency on third-party semiconductor supply chains.
      - icon: flower
        title: Enzyme-based biosensing
        text: Our glucose oxidase sensors are formulated, coated, and calibrated internally. Every production lot is released against the same analytical acceptance criteria, and lot-level release data is available to partners under our quality agreement — not just data from a reference batch.
      - icon: console
        title: Self-developed algorithms
        text: We build our own glucose calculation, trend prediction, and alert logic from the ground up. This lets us customize for pediatric ranges, gestational thresholds, or insulin pump communication protocols without waiting on external roadmap priorities.
      - icon: data
        title: Biochemical processing platform
        text: Enzyme immobilization, membrane deposition, and sensitivity tuning are handled under one roof. Controlling these steps internally is what lets us hold sensor-to-sensor variation inside our release specification — which is why we can report batch-level performance for every production run, not only for a reference batch.
      - icon: factory
        title: Integrated manufacturing
        text: From biosensor wafer to sealed transmitter, every stage happens in our own facilities. Each unit gets a unique QR code for full component traceability, and automated in-line testing catches deviations before they leave the line.
      - icon: chart
        title: SPC-controlled quality systems
        text: We run Statistical Process Control across electrode printing, laser cutting, dispensing, and coating. Our own inspection equipment feeds data back into the line in real time, so we adjust before defects accumulate, not after.

  - type: card-grid
    center: true
    columns: 3
    media: icon
    title: What drives us forward?
    text: The vision, mission, and values that guide every decision we make, from sensor design to partner relationships.
    items:
      - icon: globe
        title: Our vision
        text: To become a world-leading provider of biosensing systems and healthcare technologies.
      - icon: handshake
        title: Our mission
        text: To support healthcare businesses with reliable biosensing technologies and scalable commercialization infrastructure.
      - icon: shield
        title: Values
        text: We believe in staying low-profile, working pragmatically, and advancing steadily through efficient execution and long-term technological commitment.

