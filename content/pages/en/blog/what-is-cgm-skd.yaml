  - type: checklist
    title: Are you ready to be an SKD partner?
    text: >-
      Before signing on, honestly assess your own setup. CGM manufacturers typically look for partners who have, or have a clear path to: a valid local medical device license, existing relationships with clinics or pharmacy chains, familiarity with local device registration, and access to a cleanroom for final assembly. Typical manufacturing prerequisites include:
    items:
      - Cleanroom — Class 10,000 (ISO 8) or higher, for sensor housing assembly
      - Quality management — ISO 13485 certification or an equivalent quality system
      - Trained personnel — Basic cleanroom protocol knowledge is enough to start; full assembly training is provided by the manufacturer
    columns: 1
    panel: true

  - type: checklist
    title: Six questions to put on the table before you sign
    text: >-
      Once you've sized up your own readiness, put these six questions on the table before you sign anything. This checklist comes straight from real supplier audits — it's the same list we'd run through before recommending any partner.
    items:
      - What exactly is included in the SKD kit?
      - What certifications do you hold?
      - Can you provide assembly training?
      - What documentation do you supply for local registration?
      - Can we start with a pilot order?
      - Do you limit the number of SKD partners in a single country?
    columns: 2
    panel: true
    tint: true

