  - type: faq
    title: Frequently asked questions
    items:
      - q: What is a private label CGM?
        a: >-
          A private label CGM is an arrangement where a certified medical manufacturer builds a fully validated continuous glucose monitoring system, and you sell it under your own company's brand name, packaging, and custom application interface.
      - q: Is private label different from OEM?
        a: >-
          Yes. Private label utilizes the manufacturer's existing hardware shape and internal components, focusing customization on branding, packaging, and software styling. OEM allows you to introduce custom industrial designs, unique physical enclosures, or proprietary hardware features built on top of the manufacturer's core biosensor platform.
      - q: Can I legally sell a CGM under my own brand name?
        a: >-
          Absolutely. This is a standard global commercial practice in the medical device industry. However, your business entity must comply with your local country's health regulations, which typically involves registering your brand as the legal distributor or marketer of the device backed by the manufacturer's technical files.
      - q: Do I need to develop or manufacture my own sensor?
        a: >-
          No. Your manufacturing partner handles all of the complex electrochemistry, sterile cleanroom production, automated micro-assembly, and clinical validation trials.
      - q: Can I customize the mobile app user interface and features?
        a: >-
          Yes. You can customize the visual branding, color themes, logo placements, language translations, and default glucose alert thresholds. Advanced API integrations are also available to link data streams directly into your own software platforms.
      - q: What specific medical certifications should I look for?
        a: >-
          At a baseline, ensure your manufacturing partner holds a valid ISO 13485 certification for medical device quality management systems. Depending on your target market, you should look for existing market registrations, local regulatory approvals, and comprehensive biocompatibility and sterilization reports — and ask which body issued each one and what scope it covers.
      - q: Can early-stage startups successfully launch a private label CGM?
        a: >-
          Yes, provided they have an established user acquisition strategy, clinical onboarding channels, or a unique software value proposition (like a specialized metabolic coaching app) that leverages the hardware data.
      - q: How do I evaluate and choose the right manufacturing partner?
        a: >-
          Prioritize clinical accuracy metrics (MARD data under 9%, published together with the protocol used to measure it), a verified track record of manufacturing consistency, the depth and organization of their regulatory technical files, and their willingness to provide long-term technical and software support.

