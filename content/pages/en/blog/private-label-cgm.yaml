  - type: richtext
    eyebrow: Model comparison
    title: Private label vs. OEM vs. SKD
    blocks:
      - heading: What is the difference
        text: >-
          When exploring manufacturing partnerships, you will encounter three primary terms: Private Label, OEM, and SKD. It is vital to understand that these are not merely different names for the same service; they represent completely different operational and regulatory commitments.

  - type: card-grid
    columns: 3
    media: icon
    items:
      - icon: box
        kicker: "1"
        title: Private label (white label)
        text: >-
          This is the fastest, lowest-barrier entry point available. You utilize the manufacturer's existing, fully realized product line — including the physical sensor casing, transmitter electronics, and standard app layout. The manufacturer applies your logo to the hardware, customizes the packaging graphics, and pushes your branded version of the app to the app stores. It is ideal for rapid market entry and agile validation.
      - icon: cog
        kicker: "2"
        title: OEM (Original equipment manufacturer)
        text: >-
          An OEM partnership represents a deeper tier of technical collaboration. While you still utilize the manufacturer's underlying, validated biosensor technology and chip architecture, you introduce custom modifications. This might include a unique physical shape for the sensor housing, a customized transmitter enclosure, or specific hardware-level feature adjustments. Because it requires custom molding, engineering hours, and potentially updated design verification testing, it demands higher upfront investment and a longer timeline than standard private labeling.
        href: /cgm-oem/
        linkLabel: Learn more about OEM partnerships
      - icon: factory
        kicker: "3"
        title: SKD (Semi-knocked-down)
        text: >-
          Semi-knocked-down means the manufacturer ships you components (such as the functional biosensor elements or PCBA electronic boards) for local assembly in your own market. This model only makes sense once you've already proven demand and you're ready to commit to serious, sustained volume for the long haul, because local assembly and the inventory it requires only pays off at scale. Also, your manufacturer doesn't need to hold the CE mark or registration for your specific market. Instead, they supply you with complete technical documentation to help you file for local medical registration.
        href: /cgm-skd/
        linkLabel: Read our full SKD guide
    note: >-
      If you are validating a new market, launching a pilot program, or looking to get a brand off the ground with minimal capital friction, stick to Private Label or light OEM. If you are an established player with an existing local assembly infrastructure, looking to win large-scale government tenders that mandate domestic production, only then should you consider the SKD pathway.

