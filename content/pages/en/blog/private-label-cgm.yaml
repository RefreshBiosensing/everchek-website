  - type: richtext
    eyebrow: Market context
    title: Why more companies are going private label
    blocks:
      - text: >-
          The global market for continuous glucose monitoring is expanding rapidly. According to market data from firms like Grand View Research and Fortune Business Insights, the global CGM market size surpassed $8 billion recently and is projected to maintain a compound annual growth rate (CAGR) of over 15% through the turn of the decade. This growth is driven by expanding clinical adoption for type 1 and type 2 diabetes, alongside a massive new wave of consumer demand for metabolic health, longevity, and athletic performance optimization.

  - type: card-grid
    title: What is driving the shift toward private label
    columns: 2
    media: icon
    items:
      - icon: clock
        title: Accelerated speed to market
        text: >-
          Developing a native CGM from scratch typically takes 3 to 5 years from initial bench testing through clinical validation and regulatory clearance. A private label approach compresses this timeline to months.
      - icon: chart
        title: Massive capital efficiency
        text: >-
          You eliminate the need to fund internal biosensor laboratories, recruit specialized cleanroom engineers, or purchase expensive automated micro-assembly lines. Capital stays liquid and can be deployed toward customer acquisition and marketing.
      - icon: shield
        title: De-risked technology assets
        text: >-
          Technical failure rates in early-stage medical hardware development are high. By adopting an existing platform, you inherit a product that has already proven its accuracy, manufacturing consistency, and safety profile across thousands of real-world patient days.
      - icon: users
        title: Strategic focus
        text: >-
          Your team does not get bogged down in technical troubleshooting or raw material supply chain snarls. You focus entirely on onboarding clinics, optimizing digital marketing funnels, and managing distribution logistics.
    note: >-
      Generally speaking, it just lets you stay in your lane. If you've built your business on marketing, community, and distribution, you don't need to suddenly become a biosensor engineering company to get into CGM. You keep doing what you're good at, and you get a compliant, working product to sell.
