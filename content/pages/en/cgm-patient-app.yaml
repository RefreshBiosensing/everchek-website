title: White-label CGM patient app for healthcare brands
description: Discover the EverChek CGM app with real-time glucose readings, trend visualization, predictive alerts, historical analytics, and healthcare platform integration support.
path: /cgm-patient-app/
translationKey: cgm-patient-app
sections:
  - type: hero
    variant: split
    visual: image
    image: /images/cgm-app-overview-final.webp
    imageAlt: >-
      Annotated overview of the EverChek CGM patient app on a smartphone. Labels highlight: real-time
      glucose value (updated every 5 minutes) showing 7.8 mmol/L with trend arrow; sensor component
      connection status; glucose change indicator arrow; remaining sensor duration and details;
      optional display of 3h/6h/12h/24h data graphs (3h by default); custom upper and lower reminder
      limits; glucose target range; event log; historical records; and glucose data analysis and
      statistics.
    ratio: 1091/976
    title: EverChek CGM app for mobile
    sub: >-
      A patient-ready continuous glucose monitoring app built for your brand. Access real-time glucose
      readings, predictive alerts, and trend visualization, fully customizable for various healthcare
      commercialization needs.
    buttons:
      - label: Contact us
        href: /contact/
        style: primary

  - type: card-grid
    title: Built for healthcare commercialization
    text: >-
      More than a glucose monitoring app. A white-label platform designed for healthcare brands to go
      to market with their own identity.
    columns: 2
    media: icon
    center: true
    items:
      - icon: globe
        title: Brand customization
        text: >-
          Customize app logos, colors, language settings, user interfaces, and localized workflows to
          better align with your regional healthcare market and commercialization strategy.
      - icon: terminal
        title: API & SDK integration
        text: >-
          Connect the app to your existing patient management platform, EMR, or telehealth system
          through documented APIs and SDKs.
      - icon: shield
        title: Regulatory support
        text: >-
          Guidance through medical device app approval processes in your target market, with
          documentation packages built for regulatory submission.
      - icon: check
        title: Continuous updates
        text: >-
          We maintain the core app infrastructure — bug fixes, OS compatibility updates, and feature
          upgrades — so your brand always runs the latest version.

  - type: feature-rows
    title: EverChek patient app features
    text: >-
      A complete set of patient-focused glucose management features, ready for your brand.
    # Phone screenshots are 300x620. Shown whole (contain) on the tinted panel, the way the
    # original page did it — a 4/3 cover crop cut the top and bottom off every screen.
    ratio: 1/1
    fit: contain
    items:
      - id: real-time-glucose
        title: Real-time glucose monitoring
        desc: >-
          Stay informed with real-time glucose updates, automatically synced from your CGM sensor to
          your phone and smartwatch. Current reading, trend arrow, and 24-hour glucose chart are
          displayed clearly on one screen, making it easy to track glucose changes at a glance.
        visual: image
        image: /images/cgm-app-phone-2.webp
        imageAlt: Real-time glucose monitoring screen on EverChek CGM app
      - id: trend-visualization
        title: Glucose trend visualization & prediction
        desc: >-
          View glucose trends over 3, 6, 12, and 24 hours with an intuitive line chart. Directional
          arrows show where your glucose is heading, helping you make informed decisions about meals,
          exercise, and insulin.
        visual: image
        image: /images/cgm-app-phone-3.webp
        imageAlt: Glucose trend visualization and prediction chart on EverChek CGM app
      - id: glucose-alerts
        title: High/low glucose alerts
        desc: >-
          Set personalized high and low glucose thresholds and receive timely alerts when your glucose
          approaches or exceeds these limits, helping you take proactive action.
        visual: image
        image: /images/cgm-app-phone-4.webp
        imageAlt: High and low glucose alert configuration on EverChek CGM app
      - id: event-logging
        title: Event logging
        desc: >-
          Log meals, exercise, insulin doses, and medication with just a few taps. Each event is
          timestamped and overlaid on your glucose trend chart, helping you connect daily activities
          with glucose changes.
        visual: image
        image: /images/cgm-app-phone-1.webp
        imageAlt: Event logging screen for meals, exercise and insulin on EverChek CGM app
      - id: history-statistics
        title: History records & statistics
        desc: >-
          Review daily, weekly, and monthly glucose summaries with key metrics including
          time-in-range, average glucose, and estimated HbA1c. Generate detailed reports to share with
          your healthcare provider.
        visual: image
        image: /images/cgm-app-phone-2.webp
        imageAlt: Historical glucose statistics and analytics dashboard on EverChek CGM app

  # Two deployment models sat side by side on the original page (.dual-grid, the
  # white-label card highlighted). Alternating full-width rows broke the comparison.
  - type: card-grid
    title: Choose your deployment model
    text: >-
      Two flexible paths to bring a CGM app to your market — pick the one that fits your
      infrastructure.
    columns: 2
    media: icon
    tint: true
    items:
      - icon: phone
        title: White-label app
        text: >-
          A ready-to-launch CGM app with your brand identity. We handle the technology; you focus on
          go-to-market. Best for: Brands that want to launch quickly without building a software team
        bullets:
          - Full app with your brand name, logo, and colors
          - Pre-configured CGM sensor pairing and data pipeline
          - App store submission support (iOS & Android)
          - Ongoing maintenance and OS compatibility updates
          - Patient onboarding materials available for co-branding
      - icon: terminal
        title: API & SDK access
        text: >-
          Connect CGM data into your existing patient platform or build your own app on top of our SDK.
          Best for: Brands with an existing healthcare platform or in-house development team
        bullets:
          - RESTful API for glucose data ingestion into your system
          - SDK documentation for building custom patient-facing features
          - Technical integration support from our engineering team
          - Sandbox environment for development and testing

  - type: faq
    title: Frequently asked questions
    items:
      - q: Can we customize the glucose alert thresholds for our target patient population?
        a: >-
          Yes. Alert thresholds for high glucose, low glucose, and predictive warnings are fully
          configurable. We can pre-set default thresholds based on your target patient demographics —
          pediatric, adult, or gestational — and individual patients can further personalize them
          within the app.
      - q: How do app updates work for white-label deployments?
        a: >-
          We manage the core app release cycle. When a new version is ready — with bug fixes, OS
          compatibility updates, or new features — we provide the update through your branded app
          listing on the App Store and Google Play. Your patients receive the update just like any
          other app update, with your brand identity intact.
      - q: Do you provide patient onboarding materials we can co-brand?
        a: >-
          Yes. We provide a full set of onboarding assets — quick-start guides, tutorial videos, and
          in-app walkthrough screens — that can be co-branded with your logo and design language. These
          materials are available in all supported languages.

  - type: link-pills
    label: Explore
    items:
      - label: What is a CGM system?
        href: /what-is-cgms/
      - label: CGM device specification
        href: /continuous-glucose-monitor/
      - label: CGM OEM manufacturing
        href: /cgm-oem/
      - label: CGM local assembly & SKD kits
        href: /cgm-skd/
      - label: CGM distribution
        href: /cgm-distribution/

  - type: banner-wide
    title: Ready to bring your branded CGM app to market?
    text: >-
      Talk to our team about white-label deployment, API integration, or a custom demo tailored to your
      market.
    align: center
    cta:
      label: Contact us
      href: /contact/

  - type: cta-banner
