  - type: faq
    title: Working with EverChek — common questions
    items:
      - q: Does EverChek sell CGM systems directly to consumers?
        a: No. EverChek is a B2B-only CGM manufacturer. We supply OEM, ODM, SKD kit, private-label and distribution partners, and we run no consumer brand of our own — so we never compete with our partners in their own markets.
      - q: What CGM manufacturing models does EverChek offer?
        a: Four. OEM and private label puts your brand on our existing CGM system. ODM adapts the platform to your specification. SKD supplies semi-knocked-down kits so final assembly happens in your market. Distribution supplies the EverChek-branded system for your territory.
      - q: How long does the EverChek CGM sensor last, and does it need fingerstick calibration?
        a: The system is designed for 14 days of continuous glucose monitoring on one sensor, and it is factory calibrated — end users do not need to perform fingerstick calibration. The sensor pairs with a Bluetooth transmitter and the EverChek patient app.
      - q: What is your CGM accuracy, and what is your MARD?
        a: MARD is only meaningful with its method attached. We publish how we measure it — reference method, comparator, wear-day and glucose-range breakdown — and we release the clinical performance summary to qualified partners under NDA. Ask us for the protocol before you ask us for the number.
      - q: Can we integrate CGM data into our own app or digital health platform?
        a: Yes. We provide API and SDK access so glucose data flows into your own app or platform. That keeps the patient relationship and the user experience with your brand rather than with a third-party app.
      - q: Where is EverChek based, and who owns it?
        a: EverChek is based in Shenzhen, China, and is a sub-brand of Refresh.cc. The company was founded in 2016 as a biosensing technology business developing wearable, miniaturized and portable intelligent biosensing solutions.
      - q: Which markets does EverChek support?
        a: We work with overseas medical device distributors, healthcare brands and government tender bidders. Algeria and the UAE are committed markets. Ask us about a specific country and we will tell you what registration exists there today and what the realistic route is.
