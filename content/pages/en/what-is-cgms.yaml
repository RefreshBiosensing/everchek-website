  - type: faq
    title: Continuous glucose monitoring questions
    items:
      - q: What is a continuous glucose monitoring system (CGMS)?
        a: >-
          A CGMS is a medical device that tracks glucose levels in real time through a small wearable
          sensor placed under the skin. Instead of a single reading at one moment, it produces
          continuous data — showing trends, patterns, and alerts for high or low glucose levels so
          clinicians and patients can make more informed, proactive treatment decisions.
      - q: How is CGM different from traditional fingerprick glucose testing?
        a: >-
          Fingerprick testing gives isolated, single-point measurements taken manually and reviewed in
          clinic. A CGMS gives real-time values, glucose trends, high and low alerts, predictive alerts,
          long-term data visibility and remote patient monitoring — so treatment decisions are based on
          a continuous glucose history rather than a snapshot.
      - q: Does a CGM sensor measure blood glucose directly?
        a: >-
          No. The sensor sits beneath the skin and reacts with glucose in the interstitial fluid,
          converting the biochemical signal into a glucose value every few minutes. Because glucose
          naturally moves from the bloodstream into the interstitial fluid, interstitial readings
          closely reflect blood glucose levels.
      - q: How often is a CGM sensor replaced?
        a: >-
          CGM systems rely on disposable sensors that are typically replaced every 14 days. For a
          distributor or healthcare brand this is the commercial characteristic that matters most: the
          business runs on continuous repeat orders rather than one-time device purchases.
      - q: How can a healthcare brand start selling CGM?
        a: >-
          There are three usual routes. SKD supplies partially assembled kits for local assembly,
          packaging and labeling under your own brand. OEM has EverChek manufacture the complete
          branded system to your specification. Distribution lets you sell ready-to-market EverChek
          products through your existing sales network with no assembly capability required.

