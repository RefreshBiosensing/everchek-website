title: What Is a Continuous Glucose Monitoring System? | EverChek
description: How a continuous glucose monitoring system (CGMS) works, how it compares with fingerprick testing, and the OEM, SKD and distribution routes to market.
path: /what-is-cgms/
translationKey: what-is-cgms
sections:
  - type: hero
    variant: standard
    title: What is a continuous glucose monitoring system (CGMS)?
    sub: >-
      A Continuous Glucose Monitoring System (CGMS) is a medical device that tracks glucose levels in
      real time through a small wearable sensor placed under the skin. Unlike traditional fingerprick
      testing, which provides a single glucose reading at one moment, CGMS offers continuous data,
      showing trends, patterns, and alerts for high or low glucose levels — helping healthcare
      providers and patients make more informed, proactive treatment decisions.
    buttons:
      - label: Ask which CGM partnership model fits your market
        href: /contact/
      - label: See the CGM device specification
        href: /continuous-glucose-monitor/
        style: ghost

  - type: step-flow
    title: How does CGMS work?
    text: >-
      Since glucose naturally moves from the bloodstream into the interstitial fluid, interstitial
      glucose readings closely reflect blood glucose levels.
    columns: 4
    items:
      - icon: patch
        title: Apply the sensor
        desc: Once the CGM is applied to your arm, the sensor begins working beneath the skin.
      - icon: sensor
        title: Read the interstitial fluid
        desc: >-
          The sensor contains biomaterials that react with glucose in the interstitial fluid. These
          reactions generate biochemical signals, which are detected and converted into glucose values
          every few minutes.
      - icon: wifi
        title: Transmit the data
        desc: The transmitter then sends this data to your phone app or receiver.
      - icon: curve
        title: See trends and alerts
        desc: >-
          Allowing you to view glucose trends, receive high and low alerts, and monitor changes
          throughout the day.

