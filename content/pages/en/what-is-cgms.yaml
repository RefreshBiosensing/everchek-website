- type: card-grid
  title: Market signals driving CGM growth
  text: The global diabetes epidemic and rising healthcare expenditure are accelerating demand for continuous monitoring
    solutions.
  columns: 4
  media: stat
  center: true
  tint: true
  items:
  - kicker: 589M+
    title: Adults worldwide living with diabetes
    text: The number of adults living with diabetes has more than tripled since 2000, driven by aging populations, rising
      obesity rates, and increasingly sedentary lifestyles across both developed and developing nations.
    source:
      label: 'Source: IDF Diabetes Atlas'
      href: https://idf.org/about-diabetes/diabetes-facts-figures/
  - kicker: $1T+
    title: Annual global diabetes healthcare expenditure
    text: Diabetes accounts for a significant and growing share of global healthcare spending, covering medications,
      devices, hospitalizations, and long-term complication management across all regions.
    source:
      label: 'Source: IDF Diabetes Atlas'
      href: https://idf.org/about-diabetes/diabetes-facts-figures/
  - kicker: 853M+
    title: Projected adults with diabetes by 2050
    text: Without significant intervention, the number of adults with diabetes is projected to continue rising sharply,
      creating sustained long-term demand for advanced monitoring and management tools.
    source:
      label: 'Source: IDF Diabetes Atlas'
      href: https://idf.org/about-diabetes/diabetes-facts-figures/
  - kicker: $13.4B
    title: Global CGM market size in 2025
    text: The CGM devices market reached an estimated USD 13.38 billion in 2025, with the US alone accounting for USD
      5.6 billion, driven by strong reimbursement policies and growing Type 2 diabetes adoption.
    source:
      label: 'Source: Grand View Research'
      href: https://www.grandviewresearch.com/industry-analysis/continuous-glucose-monitoring-market
  - kicker: 16.3%
    title: CAGR forecast 2026–2035
    text: The CGM market is projected to grow at a compound annual growth rate of 16.3% from 2026 to 2035, outpacing
      most other medical device segments and reflecting accelerating global adoption.
    source:
      label: 'Source: GM Insights'
      href: https://www.gminsights.com/industry-analysis/continuous-glucose-monitoring-market
  - kicker: $41.4B
    title: Projected CGM market size by 2033
    text: The global CGM devices market is forecast to nearly triple from 2025 levels, reaching USD 41.41 billion by
      2033 as non-invasive technologies and AI-powered analytics drive next-generation adoption.
    source:
      label: 'Source: Grand View Research'
      href: https://www.grandviewresearch.com/industry-analysis/continuous-glucose-monitoring-market
  - kicker: 50.5%
    title: Diabetes patients not achieving glycemic targets
    text: Despite advances in treatment, only about half of individuals with diabetes achieve recommended glycemic targets
      —highlighting the urgent need for better continuous monitoring solutions.
    source:
      label: 'Source: ADA Clinical Diabetes'
      href: https://diabetesjournals.org/clinical/article/43/3/399/158023
  - kicker: 4.2%
    title: Global diabetes prevalence growth rate
    text: Diabetes prevalence continues to rise at approximately 4.2% annually in developing regions, driven by urbanization,
      dietary changes, and aging populations —expanding the addressable CGM market.
    source:
      label: 'Source: IDF Diabetes Atlas'
      href: https://idf.org/about-diabetes/diabetes-facts-figures/
- type: card-grid
  title: Are CGMS worth it for healthcare providers?
  text: Adding CGM to your healthcare portfolio creates clinical and commercial value across multiple dimensions.
  columns: 3
  media: icon
  center: true
  items:
  - icon: shield
    title: Retain market share
    text: As CGM adoption grows, offering CGM solutions helps your business stay competitive in an evolving diabetes
      care market and meet changing customer expectations.
  - icon: box
    title: Expand product category
    text: Add CGM to your existing diabetes, diagnostic, or chronic care portfolio, creating extra value for clients
      and new opportunities for growth.
  - icon: chart
    title: Grow revenue
    text: CGM systems rely on disposable sensors that are typically replaced every 14 days, allowing you to benefit from
      continuous repeat orders rather than one-time purchases.
  - icon: heart
    title: Improve patient treatment
    text: CGM gives you trend-based glucose insights instead of isolated measurements, helping doctors and healthcare
      teams make informed treatment decisions.
  - icon: hospital
    title: Improve clinical efficiency
    text: You can reduce reliance on scattered glucose checks and integrate continuous glucose data into digital health
      workflows, improving patient monitoring beyond in-person visits.
  - icon: curve
    title: Support preventive monitoring
    text: CGM allows care teams to monitor patients' glucose changes continuously, helping identify abnormal patterns
      before they become more serious.
