  - type: richtext
    eyebrow: Start here
    title: Introduction to CGM Technology
    blocks:
      - text: Continuous Glucose Monitoring (CGM) has transformed diabetes management over the past decade. Unlike traditional fingerstick methods that provide a single glucose reading at a point in time, CGM systems deliver real-time glucose data every few minutes, giving users and healthcare providers a complete picture of glucose trends and patterns.
      - text: For healthcare brands looking to enter the diabetes management market, understanding the core technology behind CGM systems is essential.
  - type: richtext
    eyebrow: The technology
    title: How CGM Sensors Work
    blocks:
      - text: Modern CGM systems use a thin, flexible sensor filament inserted just beneath the skin to measure glucose levels in the interstitial fluid. The sensor contains a glucose oxidase enzyme that reacts with glucose molecules, creating an electrical signal proportional to the glucose concentration.
    tint: true
  - type: card-grid
    title: Key components of a CGM system
    columns: 4
    media: icon
    items:
      - icon: sensor
        title: Sensor
        text: The disposable component worn for 7-14 days, containing the glucose-sensing element.
      - icon: wifi
        title: Transmitter
        text: A reusable electronic module that powers the sensor and transmits data wirelessly.
      - icon: set
        title: Applicator
        text: A device that inserts the sensor consistently and painlessly.
      - icon: phone
        title: Mobile App
        text: Software that displays glucose readings, trends, and alerts.
  - type: card-grid
    title: "MARD: The Accuracy Standard"
    text: "MARD (Mean Absolute Relative Difference) is the primary metric used to evaluate CGM accuracy. It measures the average difference between CGM readings and reference blood glucose values."
    columns: 3
    media: none
    items:
      - title: Below 10% MARD
        text: Considered excellent accuracy for clinical use.
      - title: Below 8% MARD
        text: State-of-the-art performance.
      - title: Above 10% MARD
        text: May require frequent calibration.
