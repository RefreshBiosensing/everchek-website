  eyebrow: Why OEM with EverChek
  title: Why choose CGM OEM with us?
  text: Five reasons why healthcare brands choose EverChek as their OEM manufacturing partner for continuous glucose
    monitoring devices.
  items:
  - id: save-big-on-cgm-r-d
    title: Save big on CGM R&D
    desc: Building a factory-calibrated enzyme-based CGMS from scratch takes years and millions in investment, with
      no guarantee of hitting acceptable MARD targets. Skip the complexity of sensor chemistry, membrane formulation,
      algorithm development, PCBA, etc. Instead, build your CGM business on our proven tech stack.
    visual: image
    image: /images/oem-why-1-save-costs.webp
    imageAlt: Save big on CGM R&D - reduce upfront investment
  - id: scale-confidently
    title: Scale confidently
    desc: From pilot runs to large-scale commercial manufacturing, our ISO 13485 certified production lines are
      built to maintain stable output. We allocate dedicated capacity for OEM partners and scale production alongside
      your growth.
    visual: image
    image: /images/oem-why-2-manufacturing.webp
    imageAlt: Scale confidently with end-to-end manufacturing
  - id: accelerate-market-entry
    title: Accelerate market entry
    desc: Enter the CGM market faster with our production-ready hardware, clinical-tested software, and active manufacturing
      lines. You can cut development cycles by months, reduce clinical preparation time, and launch while competitors
      are still designing their first sensor.
    visual: image
    image: /images/oem-why-3-market-launch.webp
    imageAlt: Accelerate market entry with faster go-to-market strategy
  - id: reduce-regulatory-complexity
    title: Reduce regulatory complexity
    desc: 'Our system architecture and technical file are built to ISO 13485 requirements and structured for medical
      device registration dossiers. We provide a complete regulatory package, including biocompatibility reports,
      cytotoxicity testing data, and full technical documentation required for your local registration. [TODO: CE
      status]'
    visual: image
    image: /images/oem-why-4-regulatory.webp
    imageAlt: Reduce regulatory complexity with pre-certified compliance
  - id: own-your-patient-data-completely
    title: Own your patient data completely
    desc: You retain full ownership and control of all patient-generated data, including real-time glucose readings,
      historical trends, and analytics outputs, while we provide the data pipeline and infrastructure.
    visual: image
    image: /images/oem-why-5-data-security.webp
    imageAlt: Own your patient data with complete data sovereignty
