- type: faq
  title: CGM OEM questions
  items:
  - q: Can we customize language of the CGM app?
    a: Yes. We provide full multilingual support across the CGM app, packaging, and product documentation. We engineer
      everything; you only need to add your logo and branding.
  - q: Can we modify glucose alert thresholds in the app?
    a: Absolutely. You can define and adjust glucose alert thresholds, including hypo/hyper limits and trend-based
      alerts, within your app configuration.
  - q: Do you offer custom adhesive shapes or sensor form factors?
    a: Yes. Custom adhesive shapes and sensor form factors are available to support your product differentiation
      strategy.
  - q: Can we export patients' glucose data for our own research or EHR integration?
    a: Yes. We provide you access to patients' glucose values, trend data, and event logs via SDK and API, which
      can be exported for EHR integration or internal research use.
  - q: What is the difference between CGM OEM and CGM SKD?
    a: With OEM we build the finished, ready-to-sell CGM and you market it under your own brand as importer or distributor.
      With SKD you receive partially assembled kits and complete final assembly, packaging and labelling in your
      own country, which can qualify the product as locally manufactured. SKD gives you local-content advantages
      but adds local licensing and quality responsibilities.
