- type: card-grid
  media: icon
  columns: 2
  dark: true
  title: What sets us apart?
  text: Our vertically integrated approach and deep technical expertise set us apart from traditional OEM suppliers.
  items:
  - icon: console
    title: Seamless app integration
    text: Whether to build a standalone CGM app or enhance an existing healthcare ecosystem, you can integrate our CGM
      system seamlessly to your infrastructure via APIs or SDKs, with minimal development effort.
  - icon: chart
    title: Favorable pricing
    text: Our vertically integrated development strategy covers sensor chips, algorithm design, and core system components
      in-house. This allows stronger cost control, stable supply, and more competitive pricing for your CGM business.
  - icon: check
    title: Reliable product quality
    text: We implement Statistical Process Control (SPC) throughout the manufacturing process to monitor, control, and
      optimize production quality in real time. This enables 80%+ yield rates, and reduces batch variation in large-scale
      CGM production.
  - icon: handshake
    title: Consistent technical support
    text: CGM OEM involves far more than manufacturing and labeling. From app integration and mold development to production
      scheduling and custom feature requests, our technical and operational teams work closely with your business to
      keep projects moving efficiently at every stage.
