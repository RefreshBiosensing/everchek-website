title: Privacy Policy | EverChek
description: How EverChek collects, uses, shares and protects the information you give us through this website and through business enquiries.
path: /privacy-policy/
translationKey: privacy-policy
sections:
  - type: prose
    layout: page
    blocks:
      - h1: "Privacy Policy"
      - lede: "Last Updated: June 18, 2026"
      - p: "EverChek (\"we,\" \"our,\" or \"us\") is committed to protecting your privacy. This Privacy Policy explains how we collect, use, disclose, and safeguard your information when you visit our website or engage with us as a business partner."
      - h2: "1. Information We Collect"
      - p: "We collect information that you voluntarily provide when you contact us, fill out forms, or inquire about our products and services:"
      - ul:
          - "<strong>Contact Information:</strong> Name, email address, phone number, company name, and job title."
          - "<strong>Business Information:</strong> Company details, industry, and information about your interest in our CGM products and services."
          - "<strong>Communication Data:</strong> Records of your correspondence with us, including emails and inquiries."
      - h2: "2. How We Use Your Information"
      - p: "We use the collected information for the following purposes:"
      - ul:
          - "To respond to your inquiries and provide information about our CGM products and services."
          - "To evaluate potential business partnerships, OEM/ODM collaborations, and distribution relationships."
          - "To improve our website, products, and customer service."
          - "To send relevant business communications, including updates about our products and industry insights."
          - "To comply with legal obligations and protect our rights."
      - h2: "3. Information Sharing"
      - p: "We do not sell your personal information. We may share your information only in the following circumstances:"
      - ul:
          - "With our subsidiaries and affiliates for business operations."
          - "With trusted service providers who assist us in operating our website and business, subject to confidentiality agreements."
          - "When required by law, to comply with legal processes, or to protect our rights."
          - "In connection with a business transaction such as a merger or acquisition."
      - h2: "4. Data Security"
      - p: "We implement appropriate technical and organizational measures to protect your information against unauthorized access, alteration, disclosure, or destruction."
      - h2: "5. Data Retention"
      - p: "We retain your information for as long as necessary to fulfill the purposes described in this policy, or as required by applicable law."
      - h2: "6. Your Rights"
      - p: "Depending on your jurisdiction, you may have the right to:"
      - ul:
          - "Access, correct, or delete your personal information."
          - "Object to or restrict the processing of your information."
          - "Withdraw consent at any time where processing is based on consent."
          - "Request a copy of your data in a portable format."
      - p: "To exercise these rights, please contact us using the information below."
      - h2: "7. Cookies"
      - p: "Our website may use cookies and similar tracking technologies to enhance your browsing experience."
      - h2: "8. Third-Party Links"
      - p: "Our website may contain links to third-party websites. We are not responsible for their privacy practices."
      - h2: "9. International Data Transfers"
      - p: "As a global company, your information may be transferred to and processed in countries other than your own. We ensure appropriate safeguards are in place for such transfers."
      - h2: "10. Changes to This Policy"
      - p: "We may update this Privacy Policy from time to time. Changes will be posted on this page with an updated \"Last Updated\" date."
      - h2: "11. Contact Us"
      - p: "If you have any questions, please contact us at: <a href=\"/cdn-cgi/l/email-protection#b1d2dedfc5d0d2c5f1d4c7d4c39cd2d9d4da9fd2dedc\">[email protected]</a>"

