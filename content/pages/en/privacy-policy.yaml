title: Privacy Policy | EverChek
description: How EverChek collects, uses, shares and protects the information you give us through this website and through business enquiries.
path: /privacy-policy/
translationKey: privacy-policy
sections:
  - type: hero
    variant: centered
    kicker: Legal
    title: Privacy Policy
    sub: |
      Last updated: June 18, 2026
    note: |
      Questions about this policy? Write to contact@ever-chek.com and a person will answer.
  - type: richtext
    eyebrow: Privacy
    title: How we handle your information
    blocks:
      - text: |
          EverChek ("we," "our," or "us") is committed to protecting your privacy. This Privacy Policy explains how we collect, use, disclose, and safeguard your information when you visit our website or engage with us as a business partner.
      - heading: 1. Information We Collect
        text: |
          We collect information that you voluntarily provide when you contact us, fill out forms, or inquire about our products and services. Contact information — name, email address, phone number, company name, and job title. Business information — company details, industry, and information about your interest in our CGM products and services. Communication data — records of your correspondence with us, including emails and inquiries.
      - heading: 2. How We Use Your Information
        text: |
          We use the collected information to respond to your inquiries and provide information about our CGM products and services; to evaluate potential business partnerships, OEM/ODM collaborations, and distribution relationships; to improve our website, products, and customer service; to send relevant business communications, including updates about our products and industry insights; and to comply with legal obligations and protect our rights.
      - heading: 3. Information Sharing
        text: |
          We do not sell your personal information. We may share your information only in the following circumstances: with our subsidiaries and affiliates for business operations; with trusted service providers who assist us in operating our website and business, subject to confidentiality agreements; when required by law, to comply with legal processes, or to protect our rights; and in connection with a business transaction such as a merger or acquisition.
      - heading: 4. Data Security
        text: |
          We implement appropriate technical and organizational measures to protect your information against unauthorized access, alteration, disclosure, or destruction.
      - heading: 5. Data Retention
        text: |
          We retain your information for as long as necessary to fulfill the purposes described in this policy, or as required by applicable law.
      - heading: 6. Your Rights
        text: |
          Depending on your jurisdiction, you may have the right to access, correct, or delete your personal information; to object to or restrict the processing of your information; to withdraw consent at any time where processing is based on consent; and to request a copy of your data in a portable format. To exercise these rights, please contact us using the details at the end of this policy.
      - heading: 7. Cookies
        text: |
          Our website may use cookies and similar tracking technologies to enhance your browsing experience.
      - heading: 8. Third-Party Links
        text: |
          Our website may contain links to third-party websites. We are not responsible for their privacy practices.
      - heading: 9. International Data Transfers
        text: |
          As a global company, your information may be transferred to and processed in countries other than your own. We ensure appropriate safeguards are in place for such transfers.
      - heading: 10. Changes to This Policy
        text: |
          We may update this Privacy Policy from time to time. Changes will be posted on this page with an updated "Last Updated" date.
      - heading: 11. Contact Us
        text: |
          If you have any questions about this Privacy Policy, or you want to exercise any of the rights described above, please contact us at contact@ever-chek.com. We are a business-to-business supplier, so enquiries reaching us are almost always from companies rather than individual patients; either way, the same policy applies.
