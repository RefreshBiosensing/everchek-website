  - type: checklist
    title: What we sign for your registration
    columns: 2
    items:
      - Manufacturer's authorisation letter naming your entity for your market
      - Declaration of conformity in the form your regulator accepts
      - Free-sale certificate where the destination market requires one
      - The technical contract between your pharmaceutical establishment and us, where the market requires one — as Algeria does
      - Translations of the IFU and labelling into the languages your dossier requires
      - Responses to regulator queries during the review, in writing

  - type: step-flow
    columns: 4
    title: How to get the documents
    items:
      - icon: pin
        title: Tell us your market and route
        desc: Import registration, local SKD assembly, or a public tender — the document set differs.
      - icon: doc
        title: Mutual NDA
        desc: Standard, two pages, counter-signed within one China business day.
      - icon: set
        title: Compiled to your checklist
        desc: Send your regulator's dossier checklist or the tender's cahier des charges; we work from that, not a generic pack.
      - icon: check
        title: We say what is missing
        desc: We do not hold certification in every market. Ask about a specific one and we will tell you what exists, what does not, and the realistic route.

