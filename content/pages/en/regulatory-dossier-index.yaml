title: Regulatory Dossier Index | EverChek
description: The full index of EverChek's CGM technical documentation — what exists, which standard governs it, who tested it, and how to get each file.
path: /regulatory-dossier-index/
translationKey: regulatory-dossier-index
sections:
  - type: hero
    variant: standard
    kicker: Published in full · No email required
    title: Regulatory Dossier Index
    sub: |
      The complete index of our CGM technical documentation: what exists, which standard governs it,
      whether testing was done by an accredited third-party laboratory or in house, and how you get each
      file. The contents are gated. The index is not.
    buttons:
      - label: Request the documents under NDA
        href: /request-nda/?src=dossier-index
        style: primary
      - label: Read our disclosure policy
        href: /certifications/
        style: ghost

  - type: richtext
    title: Why publish the index but not the files
    blocks:
      - text: Most regulatory-affairs reviewers do not need our documents on day one. They need to know whether the documents exist, what they cover, and how fast they can get them — because that is what decides whether your registration timeline is realistic.
      - text: Publishing the index answers that in sixty seconds and discloses nothing confidential. Publishing the files themselves would put certificate numbers, test data and laboratory reports on a public page, where they are useful mainly to competitors assembling their own dossiers. So the index is open, and the contents are released under a mutual NDA — compiled against your regulator's checklist rather than as a generic pack.
      - text: If a document you need is not on this list, ask. We will tell you whether it exists, whether it can be produced, and roughly how long that would take — including when the answer is that it does not exist yet.

