title: CGM Certifications & Regulatory Documentation | EverChek
description: Which CGM certifications we hold, which body issued them and what they cover. Certificate numbers and test reports go to partners under mutual NDA.
path: /certifications/
translationKey: certifications
sections:
  - type: hero
    variant: standard
    kicker: Regulatory documentation for CGM partners
    title: Documentation, and how you get it
    sub: We publish which certifications we hold, which body issued them, and what scope they cover. Certificate numbers, validity dates, test reports and clinical performance summaries are released in full to qualified partners under a mutual NDA — because your own registration file requires them.
    buttons:
      - label: Request the certification pack (mutual NDA)
        href: /request-nda?src=certifications
        style: primary
      - label: View the Regulatory Dossier Index
        href: /regulatory-dossier-index/
        style: ghost

  - type: richtext
    eyebrow: Disclosure policy
    title: Our disclosure policy, stated plainly
    blocks:
      - heading: What we publish, and what we do not
        text: |
          We publish which certifications we hold, which body issued them, and what scope they cover. We do
          not publish certificate numbers, clinical datasets, production capacity, minimum order quantities,
          lead times or pricing on this website.
      - heading: A publication policy, not a partnership policy
        text: |
          Certificate numbers, validity dates and issuing-body references are provided in full to qualified
          partners under a mutual NDA — and they have to be, because your own registration file requires
          them. Algeria's homologation form, for example, has a mandatory field for the ISO 13485
          certificate number and its issuing authority. We fill those fields in. We just don't put them on a
          public web page for competitors to copy into their own dossiers.
    tint: true

  - type: card-grid
    center: true
    columns: 3
    media: icon
    title: Your compliance, simplified
    text: Struggling to navigate local regulations? Our CGM system comes with a structured documentation package that helps you prepare submissions, reduce review cycles, and get to market faster.
    items:
      - icon: check
        title: Prepare your filing faster
        text: Structured validation documentation means your regulatory team assembles the dossier for your target market from an existing, indexed file rather than commissioning testing from scratch.
      - icon: shield
        title: Reduce compliance risk
        text: Audit-ready test reports from a certified quality management system give you defensible evidence during regulatory reviews and partner audits.
      - icon: doc
        title: Build brand trust
        text: Well-documented quality systems and a transparent performance-reporting method strengthen your brand's credibility with healthcare professionals and procurement committees.

