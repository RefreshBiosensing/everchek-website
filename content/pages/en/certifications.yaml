  - type: checklist
    title: Inside the technical documentation package
    text: The index below is public. The contents are released under NDA, compiled against the dossier checklist your market actually uses.
    columns: 2
    panel: true
    tint: true
    items:
      - ISO 13485 certificate — certification of our quality management system for the design, development and manufacturing of CGM systems.
      - Cytotoxicity report — confirms that materials contacting the patient's skin do not cause cell death or toxic reactions.
      - Sensitization report — evaluates whether any component of the CGM system may cause allergic reactions or skin sensitization after repeated contact.
      - Systemic toxicity report — testing related to potential harmful biological effects after systemic exposure to product materials.
      - Irritation report — determines whether the sensor, adhesive, or other skin-contacting materials cause redness, swelling, or tissue damage.
      - Biocompatibility evaluation — assessment of biological safety and compatibility between the device and the human body.
      - Chemical characterization report — analysis and identification of chemical substances associated with product materials.
      - Leachables testing report — measures potential chemicals that may leach from sensor materials into the body under simulated use conditions, supporting biocompatibility.
      - Clinical performance summary — reports the accuracy of our CGM system against a laboratory reference method, with the study design, comparator and per-range breakdown attached.
      - "Sterilization validation — documents that our sterilization process consistently achieves a sterility assurance level (SAL). [TODO: sterilization method]"
      - Factory calibration validation — proves that our in-house calibration process sets sensor accuracy before shipment, so users do not need fingerstick calibration.
      - Stability & shelf-life validation — data from real-time and accelerated aging studies confirming sensor performance and battery life over the labeled shelf life.

  - type: step-flow
    columns: 3
    center: true
    title: How do we support your compliance preparation?
    text: As a CGM manufacturer, we maintain structured documentation that is shared with qualified partners under NDA to support your regulatory filing.
    items:
      - icon: mail
        title: You request the documents
        desc: Tell us your market and your route — import registration, local SKD assembly, or a public tender. If you send us the tender notice or the regulator's dossier checklist, we work from that checklist rather than sending a generic pack.
      - icon: doc
        title: We compile and deliver
        desc: We provide the technical file package — certificates with numbers and validity dates, test results and supporting study data — formatted for the submission you are actually making.
      - icon: check
        title: You submit to authorities
        desc: Your team integrates the documentation into your own regulatory dossier and files with the relevant health authority in your market. We sign what your regulator needs us to sign.

  - type: richtext
    eyebrow: Limits
    title: What we do not claim
    blocks:
      - heading: We do not hold certification in every market, and we say so
        text: |
          Ask us about a specific market and we will tell you what exists there today, what does not, and
          what the realistic route is. A supplier who claims complete coverage of every jurisdiction is a
          supplier who has not read the jurisdictions.
      - heading: How we talk about accuracy
        text: |
          We report sensor accuracy the way regulators evaluate it — as agreement against a laboratory
          reference method, with the study design disclosed — rather than as a single marketing number.
          Published accuracy figures are not comparable between suppliers unless the study design is
          disclosed, a point made repeatedly in the peer-reviewed literature. So we give you the method, and
          we give you sensors to verify it yourself.

