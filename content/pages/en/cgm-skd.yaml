  - type: faq
    title: Frequently asked questions
    items:
      - q: How difficult is it to assemble a CGM SKD kit?
        a: Assembly is extremely straightforward. Every component features snap-fit mechanisms, and you will hear an audible click when each part is correctly in place. Also, we provide detailed instructions, cleanroom guidelines, quality assurance procedures, and training to ensure smooth assembly and reliable device performance.
      - q: What is the difference between CGM OEM and SKD?
        a: >-
          OEM means we manufacture fully finished, ready-to-use CGM devices for you to brand and sell directly.
          Regulatory certification of the finished device remains under our responsibility, and you operate under a
          distributor/importer model. [TODO: CE status] With CGM SKD, we send you separate components including
          sensor, transmitter, adhesive patch, and applicator. You assemble them locally, which reduces shipping
          volume and lowers import tariffs since SKD often qualifies for lower duties. However, you must obtain your
          own local manufacturing or assembly license, complete final quality checks, and take full regulatory
          responsibility for the finished CGM products in your market. OEM is simpler but relatively more costly.
          SKD is more flexible, and can often reduce import duties, or meet "Made in Country" requirements but adds
          regulatory and quality control duties.
      - q: Do you provide regulatory support for SKD?
        a: Yes. For SKD partners, we provide the technical documentation and support needed for your local regulatory application — performance verification reports, biocompatibility assessment, ISO 13485 evidence and IEC standard test reports. You lead the submission in your market; we supply the file behind it.
      - q: Can I get market exclusivity on a CGM SKD model?
        a: Yes, CGM SKD partnerships are structured with regional or country-level exclusivity to protect your market position.

