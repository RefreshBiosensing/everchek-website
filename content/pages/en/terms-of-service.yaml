    blocks:
      - h1: "Terms of Service"
      - lede: "Last Updated: June 18, 2026"
      - p: "These Terms of Service (\"Terms\") govern your access to and use of the EverChek website and any related services. By accessing or using our website, you agree to be bound by these Terms."
      - h2: "1. Business Purpose"
      - p: "EverChek is a B2B-focused CGM (Continuous Glucose Monitoring) manufacturer, providing OEM, ODM, SKD, and CKD solutions to healthcare businesses worldwide. Our website is intended for business-to-business interactions and professional inquiries."
      - h2: "2. Intellectual Property"
      - p: "All content on this website, including text, graphics, logos, images, product specifications, and software, is the property of EverChek or its licensors and is protected by applicable intellectual property laws. You may not reproduce, distribute, modify, or create derivative works without our prior written consent."
      - h2: "3. Use of Website"
      - p: "You agree to use this website only for lawful purposes and in a manner that does not infringe the rights of others. You may not:"
      - ul:
          - "Use the website for any unauthorized commercial purpose."
          - "Attempt to gain unauthorized access to our systems."
          - "Transmit any harmful code or interfere with the website's operation."
          - "Misrepresent your identity or affiliation with any entity."
      - h2: "4. Product Information"
      - p: "Product specifications, descriptions, and images on this website are for informational purposes and may be subject to change without notice. We strive to ensure accuracy but do not guarantee that all information is complete, current, or error-free. Formal product specifications will be provided in the context of our business agreements."
      - h2: "5. Inquiries and Communications"
      - p: "When you submit inquiries through our website, you agree to provide accurate and complete information. We reserve the right to decline any business engagement at our discretion."
      - h2: "6. Limitation of Liability"
      - p: "To the fullest extent permitted by law, EverChek shall not be liable for any indirect, incidental, special, consequential, or punitive damages arising from your use of this website or any products or services described herein."
      - h2: "7. Disclaimer"
      - p: "This website and its content are provided on an \"as is\" and \"as available\" basis. EverChek makes no warranties, express or implied, regarding the website's operation, accuracy, or reliability."
      - h2: "8. Regulatory Compliance"
      - p: "Our CGM products are manufactured in compliance with applicable quality management standards. Customers and partners are responsible for ensuring compliance with local regulatory requirements for medical devices in their respective markets."
      - h2: "9. Confidentiality"
      - p: "Any information shared through business inquiries, including product specifications and pricing, is confidential and should not be disclosed to third parties without our written consent."
      - h2: "10. Governing Law"
      - p: "These Terms shall be governed by and construed in accordance with the laws of China. Any disputes arising from these Terms shall be resolved through friendly negotiation or through the courts of competent jurisdiction in China."
      - h2: "11. Changes to Terms"
      - p: "We reserve the right to modify these Terms at any time. Changes will be effective upon posting. Your continued use of the website after changes constitutes acceptance of the new Terms."
      - h2: "12. Contact"
      - p: "For questions about these Terms, please contact us at: <a href=\"/cdn-cgi/l/email-protection#b3d0dcddc7d2d0c7f3d6c5d6c19ed0dbd6d89dd0dcde\">[email protected]</a>"

