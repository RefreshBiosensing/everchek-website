  - type: richtext
    eyebrow: Start here
    title: The Government Tender Opportunity
    blocks:
      - text: Government healthcare tenders represent a significant opportunity for medical device companies. Many countries, particularly in Southeast Asia, the Middle East, Africa, and Latin America, are investing heavily in diabetes care infrastructure, including CGM systems.
      - text: However, winning these tenders requires meeting specific qualification criteria, including local content requirements, technology transfer commitments, and after-sales service capabilities.
  - type: card-grid
    title: The SKD Advantage
    text: The Semi-Knocked Down (SKD) manufacturing model offers a unique competitive edge in government tender bidding.
    columns: 4
    media: icon
    items:
      - icon: building
        title: Local Value-Add Requirements
        text: Many government tenders require a minimum percentage of local value-add. By importing CGM components through the SKD model and performing final assembly locally, you can meet these requirements without building a full manufacturing facility from scratch.
      - icon: chart
        title: Reduced Import Duties
        text: Importing components rather than finished products typically qualifies for lower tariff rates. This cost advantage can be reflected in more competitive tender pricing, improving your bid position.
      - icon: users
        title: Local Job Creation
        text: Government tender evaluation criteria often include local economic impact. SKD assembly operations create local jobs in manufacturing, quality control, and logistics, strengthening your tender application.
      - icon: doc
        title: Regulatory Pathway Support
        text: EverChek provides comprehensive technical documentation and regulatory support for SKD partners, including quality management system documentation, test reports, and compliance materials that simplify local regulatory approval.
    tint: true
