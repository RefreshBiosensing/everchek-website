        title: Assess target market tender requirements
      - icon: factory
        title: Develop local assembly infrastructure
      - icon: shield
        title: Establish quality management system
      - icon: doc
        title: Prepare tender documentation with manufacturer support
      - icon: handshake
        title: Submit competitive bid with SKD cost advantage
