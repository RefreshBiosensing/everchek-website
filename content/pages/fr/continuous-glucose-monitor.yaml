        title: R&D et fabrication internes
        text: Nous détenons des brevets sur les technologies CGM clés — puces, capteurs et systèmes biochimiques — et disposons d’une usine de 2 000 m² dotée d’une salle blanche de classe 10 000. Cela nous donne une maîtrise plus étroite de la performance des capteurs, de la constance des produits et de leurs évolutions futures.
      - icon: chart
        title: Coûts et stabilité de l’approvisionnement
        text: En pilotant nous-mêmes les procédés de production essentiels, nous réduisons continuellement les coûts produit et maintenons une capacité de fabrication stable pour tous nos clients. Développez votre activité en confiance, avec une tarification compétitive, un approvisionnement CGM fiable et des délais de livraison tenus.
      - icon: handshake
        title: Modèles de coopération souples
        text: Nous prenons en charge le SKD pour la production locale et l’enregistrement CE, la personnalisation OEM sous votre marque et les partenariats de distribution. Le développement technique, la production et le conditionnement étant gérés en interne, nous nous adaptons rapidement à différents objectifs commerciaux et stades de croissance.

  - type: faq
    title: Questions fréquentes
    items:
      - q: Qu’est-ce qu’un moniteur CGM ?
        a: CGM signifie Continuous Glucose Monitor, c’est-à-dire mesure continue du glucose. Destiné à la prise en charge du diabète, il s’agit d’un dispositif médical porté sur le corps qui mesure en continu la concentration de glucose dans le liquide interstitiel. Il fournit aux patients comme aux professionnels de santé des tendances glycémiques en temps réel, au-delà des mesures ponctuelles.
      - q: Les moniteurs CGM EverChek sont-ils douloureux ?
        a: La plupart des utilisateurs rapportent une douleur minime, voire nulle. Notre capteur est en effet inséré au moyen d’un système d’application rapide, en 0,2 milliseconde seulement.
      - q: Quelle est l’exactitude des moniteurs CGM EverChek ?
        a: >-
          L’exactitude est caractérisée par le MARD (Mean Absolute Relative Difference) par rapport à
          une méthode de référence de laboratoire. Notre synthèse de performance clinique — plan
          d’étude, méthode de référence, taille de l’échantillon et résultats par segments — est
          communiquée aux partenaires qualifiés sous accord de confidentialité réciproque, sous la
          forme qu’attendront votre organisme notifié ou votre autorité de santé.
      - q: EverChek est-il invasif ou non invasif ?
        a: Il est peu invasif. Un fin filament capteur est inséré juste sous la peau et peut être porté jusqu’à 14 jours. Le dispositif, léger et de la taille d’une pièce de monnaie, est conçu pour un port quotidien stable avec une sensation minimale.
      - q: Où en est la certification CE de votre CGM ?
        a: Nous sommes actuellement en cours d’obtention de la certification CE. Pour nos partenaires SKD, nous pouvons également fournir la documentation technique et un accompagnement pour les demandes d’homologation locales. N’hésitez pas à nous contacter pour discuter de votre projet.
      - q: Quelle est votre quantité minimale de commande (MOQ) ?
        a: Comme nous développons et fabriquons nos systèmes CGM en interne, nous sommes très souples dans la coopération et n’imposons pas de MOQ fixe. Quels que soient le volume de commande ou le besoin, nous pouvons nous adapter. Contactez-nous et voyons ensemble comment vous accompagner.
      - q: Que mesure un CGM ?
        a: Le CGM mesure la concentration de glucose dans le liquide interstitiel sous la peau, et non directement dans le sang. Son principal avantage est de fournir des valeurs de glucose continues et en temps réel, 24 h/24 et 7 j/7. L’utilisateur comprend ainsi l’évolution de sa glycémie dans le temps, en particulier après les repas, l’exercice et les activités quotidiennes, ce qui facilite aussi les décisions thérapeutiques.
      - q: Quelles données peut-on consulter dans l’application ?
        a: L’utilisateur peut consulter ses valeurs de glucose en temps réel et l’historique des tendances, saisir ses activités quotidiennes et recevoir des notifications d’alerte ainsi que des prédictions glycémiques.
      - q: Le CGM peut-il remplacer les tests par piqûre au bout du doigt ?
        a: Le CGM fournit des données de tendance glycémique en continu, mais un test par piqûre au bout du doigt peut rester nécessaire dans certaines situations, par exemple lorsque les symptômes ne correspondent pas aux valeurs affichées. Le CGM permet néanmoins de réduire fortement le recours global aux piqûres au bout du doigt.
      - q: Quelle est la durée de vie du capteur ?
        a: Le capteur est conçu pour une utilisation continue pouvant aller jusqu’à 14 jours.
      - q: Le CGM peut-il être utilisé en milieu clinique ?
        a: Oui. Il convient aussi bien à la surveillance hospitalière qu’aux programmes ambulatoires de prise en charge du diabète. Nous proposons également une application dédiée aux médecins et pouvons adapter notre système à différentes exigences cliniques. Contactez-nous pour évoquer vos besoins de surveillance glycémique hospitalière ou clinique.
      - q: Où le capteur se pose-t-il ?
        a: Le capteur se pose généralement à l’arrière du bras, entre le biceps et le triceps. Cette zone limite l’influence des mouvements musculaires et favorise des mesures stables et régulières pendant les activités quotidiennes.
      - q: Puis-je personnaliser le produit ou le logiciel ?
        a: Tout à fait. Nous pouvons personnaliser aussi bien le produit que le logiciel selon vos exigences. Envoyez-nous un message afin que nous puissions étudier votre projet en détail.
      - q: Puis-je faire fabriquer le CGM sous ma propre marque ?
        a: Oui. Nous prenons en charge le SKD, l’OEM et bien d’autres modèles de partenariat. Contactez-nous, parlons-en !
      - q: À quelle fréquence la valeur de glucose est-elle actualisée ?
        a: Les données de glucose sont actualisées toutes les 5 minutes et transmises à l’application en temps réel.
      - q: La performance du capteur reste-t-elle fiable sur 14 jours ?
        a: Le capteur est conçu pour conserver une performance stable pendant toute la durée de port, dans des conditions normales d’utilisation.
      - q: Quelles alertes le système fournit-il ?
        a: Le système fournit des alertes configurables d’hyperglycémie et d’hypoglycémie, ainsi que des prédictions fondées sur les tendances, afin d’aider l’utilisateur à réagir à temps.

