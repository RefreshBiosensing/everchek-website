  - type: step-flow
    title: Comment poser et utiliser notre CGM EverChek ?
    text: "Trois étapes simples pour démarrer : poser, appairer, puis suivre les données de glucose en temps réel sur votre smartphone."
    columns: 3
    arrows: true
    center: true
    tint: true
    items:
      - icon: patch
        title: "Étape 1 : pose"
        desc: Après avoir nettoyé la peau, retirez le capot inférieur du CGM EverChek et appliquez l’applicateur fermement et verticalement sur le bras. Le déclic indique que le capteur a été correctement posé.
      - icon: phone
        title: "Étape 2 : appairage et préchauffage"
        desc: Téléchargez l’application EverChek, scannez le QR code et effectuez l’appairage Bluetooth. Patientez 1 heure, le temps du préchauffage du capteur, avant l’affichage des premières valeurs.
      - icon: curve
        title: "Étape 3 : surveillance"
        desc: Consultez les données de glucose en temps réel sur votre téléphone et recevez les alertes haute et basse. Enregistrez vos activités quotidiennes, alimentation et exercice physique, pour mieux comprendre vos profils glycémiques. Retirez le transmetteur au bout de 14 jours.

  - type: card-grid
