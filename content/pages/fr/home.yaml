    center: true
    eyebrow: Modèles de coopération
    title: Quatre façons de travailler avec un fabricant CGM B2B
    text: Chaque partenaire part de la même plateforme CGM. Ce qui change, c’est la part qui porte votre marque et le lieu où se fait l’assemblage final.
    items:
      - icon: box
        title: CGM en OEM et marque blanche
        text: Lancez votre propre marque de CGM sur notre matériel, notre firmware et notre application patient, sans investir dans la R&D capteur ni dans votre propre ligne d’assemblage.
        href: /fr/cgm-oem/
        linkLabel: OEM et marque blanche
      - icon: factory
        title: Kits SKD et montage local
        text: Importez des kits semi-knocked-down (SKD) et réalisez l’assemblage final sur votre propre marché — la voie utilisée pour répondre aux règles de taux d’intégration locale, obtenir des allègements de droits d’importation et concourir aux appels d’offres régionaux.
