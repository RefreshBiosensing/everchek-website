    title: "Des biocapteurs aux CGM : qui nous sommes"
    text: Créée en 2016, notre société est spécialisée dans les technologies de biodétection et se consacre à la R&D et à la commercialisation de solutions intelligentes de biodétection portables, miniaturisées et nomades. En nous appuyant sur nos propres puces capteurs, biocapteurs et plateformes algorithmiques, nous aidons les marques de santé à commercialiser des produits CGM à travers des modèles de coopération flexibles, qui vont du composant de base au système destiné à l’utilisateur final.
    image: /images/about-factory-corridor.webp
