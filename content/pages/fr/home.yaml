  - type: checklist
    columns: 2
    panel: true
    title: Conçu exclusivement pour les partenariats CGM en B2B
    text: Nous nous consacrons exclusivement à aider les partenaires de santé à lancer et développer leur propre activité CGM partout dans le monde.
    items:
      - Développement intégré verticalement — nous développons en interne les puces, les biocapteurs, les algorithmes, les systèmes matériels et l’infrastructure numérique, ce qui nous donne une meilleure maîtrise technique et une stabilité d’approvisionnement durable.
      - Qualité stable — nos procédés de fabrication sont pilotés par MSP (maîtrise statistique des procédés) afin de réduire les variations et de maintenir une qualité constante d’un lot à l’autre. Vous recevez des capteurs fiables, au comportement identique.
      - Voies de coopération flexibles — maîtrisant l’intégralité de la R&D et de la fabrication, nous laissons les acteurs de santé choisir librement le modèle de partenariat CGM correspondant à leurs objectifs de marché.
      - "Collaboration technique dédiée — nos équipes d’ingénierie et d’exploitation travaillent étroitement avec les partenaires à chaque étape : intégration applicative, personnalisation, production et commercialisation."
      - Appui réglementaire et conformité — nous accompagnons les acteurs de santé avec la documentation technique, les rapports d’essais et les éléments de conformité qui simplifient la préparation de votre dossier et accélèrent la mise sur le marché.
      - Capacité de production évolutive — notre outil industriel accompagne aussi bien un déploiement initial qu’une montée en volume ultérieure, sans vous obliger à requalifier votre chaîne d’approvisionnement.
  - type: card-grid
    columns: 3
    center: true
    eyebrow: Documentation
    title: Certifications et validation
    text: Nos systèmes CGM s’appuient sur des essais réglementaires et une documentation de validation qui aident votre entreprise à préparer son dossier d’homologation et à commercialiser en confiance.
    items:
      - icon: shield
        title: Certification ISO 13485
        text: Nos systèmes de production fonctionnent selon les exigences de management de la qualité ISO 13485 applicables au développement et à la fabrication de dispositifs médicaux. Le numéro de certificat et l’organisme certificateur sont communiqués aux partenaires qualifiés sous accord de confidentialité.
      - icon: doc
        title: Rapport de cytotoxicité
        text: Nous avons obtenu des rapports d’essais de cytotoxicité à l’appui de l’évaluation de la sécurité biologique des matériaux utilisés dans nos systèmes CGM.
      - icon: check
        title: Rapport de sensibilisation
        text: Des essais de sensibilisation ont été réalisés afin d’évaluer les risques potentiels d’allergie ou de sensibilisation cutanée pendant l’utilisation du produit.
    note: Nous publions quelles certifications nous détenons, quel organisme les a délivrées et quel périmètre elles couvrent — mais ni numéros de certificat, ni jeux de données cliniques, ni capacité de production, ni MOQ, ni délais, ni prix.
