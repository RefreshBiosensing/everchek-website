  - type: card-grid
    columns: 3
    tint: true
    center: true
    title: Pourquoi les partenaires de santé choisissent-ils notre système CGM ?
    text: Conçu pour la fiabilité, l’exactitude et une intégration fluide dans les parcours de soins.
    items:
      - icon: curve
        title: L’exactitude, énoncée comme elle doit l’être
        text: |
          Le MARD n’a de sens qu’accompagné de sa méthode. Nous publions la manière dont nous le
          mesurons — méthode de référence, comparateur, répartition par jour de port et par plage
          glycémique — et nous communiquons la synthèse des performances cliniques aux partenaires
          qualifiés sous accord de confidentialité. Demandez-nous le protocole avant de nous demander
          le chiffre ; c’est le protocole qui vous dit si le chiffre veut dire quelque chose.
      - icon: shield
        title: Stable
        text: Conçu pour 14 jours de mesure continue du glucose à différentes températures de stockage et d’utilisation, notre système CGM réduit les incertitudes de fiabilité tout au long de la chaîne logistique et de l’usage quotidien.
      - icon: data
        title: Intégration API/SDK
        text: Intégrez les données CGM des patients directement dans votre propre application ou plateforme de santé numérique. Vous conservez ainsi la relation patient, maîtrisez l’expérience utilisateur et développez votre écosystème librement.
      - icon: check
        title: Étalonnage en usine
        text: Aucun étalonnage par piqûre au doigt n’est nécessaire. Vos clients posent le capteur et c’est parti. Vous passez à l’échelle sereinement, avec moins de tickets de support et des clients plus satisfaits.
      - icon: cloud
        title: Résistance à l’eau
        text: "Le capteur et le transmetteur sont scellés pour la douche, la natation et le sport sans retirer le capteur. [TODO: IP rating — site currently says both IPX8 and IP28; state the rating and the tested depth and duration once engineering has settled it.]"
      - icon: patch
        title: Léger
        text: Conçu pour un port prolongé confortable, notre CGMS aide les marques de santé à améliorer l’adoption par les utilisateurs et l’expérience produit dans son ensemble.
