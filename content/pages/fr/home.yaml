  - type: faq
    title: Travailler avec EverChek — questions fréquentes
    items:
      - q: EverChek vend-il des systèmes CGM directement aux particuliers ?
        a: Non. EverChek est un fabricant de CGM exclusivement B2B. Nous fournissons des partenaires en OEM, ODM, kits SKD, marque blanche et distribution, et nous n’exploitons aucune marque grand public — nous ne concurrençons donc jamais nos partenaires sur leurs propres marchés.
      - q: Quels modèles de fabrication CGM EverChek propose-t-il ?
        a: Quatre. L’OEM et la marque blanche apposent votre marque sur notre système CGM existant. L’ODM adapte la plateforme à votre cahier des charges. Le SKD fournit des kits semi-knocked-down pour que l’assemblage final ait lieu sur votre marché. La distribution fournit le système sous marque EverChek pour votre territoire.
      - q: Combien de temps dure le capteur CGM EverChek et faut-il l’étalonner par piqûre au doigt ?
        a: Le système est conçu pour 14 jours de mesure continue du glucose avec un seul capteur, et il est étalonné en usine — l’utilisateur final n’a aucun étalonnage par piqûre au doigt à réaliser. Le capteur fonctionne avec un transmetteur Bluetooth et l’application patient EverChek.
      - q: Quelle est l’exactitude de votre CGM et quel est votre MARD ?
        a: Le MARD n’a de sens qu’accompagné de sa méthode. Nous publions la manière dont nous le mesurons — méthode de référence, comparateur, répartition par jour de port et par plage glycémique — et nous communiquons la synthèse des performances cliniques aux partenaires qualifiés sous accord de confidentialité. Demandez-nous le protocole avant de nous demander le chiffre.
      - q: Pouvons-nous intégrer les données CGM dans notre propre application ou plateforme de santé numérique ?
        a: Oui. Nous fournissons un accès API et SDK pour que les données glycémiques alimentent votre propre application ou plateforme. La relation patient et l’expérience utilisateur restent ainsi attachées à votre marque plutôt qu’à une application tierce.
      - q: Où EverChek est-il implanté et à qui appartient la société ?
        a: EverChek est implanté à Shenzhen, en Chine, et constitue une sous-marque de Refresh.cc. La société a été fondée en 2016 comme entreprise de technologies de biodétection développant des solutions intelligentes de biodétection portables, miniaturisées et nomades.
      - q: Quels marchés EverChek accompagne-t-il ?
        a: Nous travaillons avec des distributeurs de dispositifs médicaux à l’international, des marques de santé et des soumissionnaires d’appels d’offres publics. L’Algérie et les Émirats arabes unis sont des marchés engagés. Interrogez-nous sur un pays précis et nous vous dirons quel enregistrement existe aujourd’hui et quelle est la voie réaliste.
