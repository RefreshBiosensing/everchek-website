  - type: image-text
    variant: right
    title: Des solutions CGM en SKD adaptées aux marchés de santé régionaux
    text: Notre solution CGM en SKD permet aux acteurs de santé de localiser l’assemblage final, de concourir aux appels d’offres régionaux, de réduire les droits d’importation et d’accélérer l’entrée sur le marché grâce à une infrastructure d’approvisionnement CGM stable et durable. Lancez votre propre marque de CGM sans le temps, le coût et la complexité qu’exige la construction de la technologie et de la production à partir de zéro.
    bullets:
      - Assemblage final réalisé sur votre propre marché
      - Répond aux exigences de taux d’intégration locale dans les marchés publics
      - Coût de revient à destination inférieur à celui des dispositifs importés finis
      - Approvisionnement en kits sur le long terme auprès d’un seul fabricant
