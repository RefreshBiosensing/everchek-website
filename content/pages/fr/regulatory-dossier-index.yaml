title: Index du dossier réglementaire | EverChek
description: 'L''index complet de la documentation technique CGM d''EverChek : ce qui existe, quelle norme
  s''applique, qui a testé, et comment obtenir chaque pièce.'
path: /fr/index-dossier-reglementaire/
translationKey: regulatory-dossier-index
sections:
- type: hero
  variant: standard
  kicker: Publié intégralement · Sans e-mail
  title: Index du dossier réglementaire
  sub: 'L''index complet de notre documentation technique CGM : ce qui existe, quelle norme s''applique,
    si les essais ont été réalisés par un laboratoire tiers accrédité ou en interne, et comment obtenir
    chaque pièce. Le contenu est sous accord. L''index ne l''est pas.'
  buttons:
  - label: Demander les documents sous accord de confidentialité
    href: /fr/accord-de-confidentialite/?src=dossier-index
    style: primary
  - label: Lire notre politique de communication
    href: /fr/documentation/
    style: ghost
- type: richtext
  title: Pourquoi publier l'index et non les fichiers
  blocks:
  - text: La plupart des responsables affaires réglementaires n'ont pas besoin de nos documents dès le
      premier jour. Ils ont besoin de savoir si ces documents existent, ce qu'ils couvrent et à quelle
      vitesse ils peuvent les obtenir — car c'est cela qui détermine si votre calendrier d'homologation
      est réaliste.
  - text: Publier l'index répond à cette question en une minute sans rien divulguer de confidentiel. Publier
      les fichiers eux-mêmes exposerait numéros de certificat, données d'essais et rapports de laboratoire
      sur une page publique, où ils servent surtout aux concurrents qui constituent leur propre dossier.
      L'index est donc ouvert, et son contenu est communiqué sous accord de confidentialité mutuel, constitué
      selon la check-list de votre autorité plutôt qu'en dossier générique.
  - text: Si une pièce dont vous avez besoin ne figure pas dans cette liste, demandez-la. Nous vous dirons
      si elle existe, si elle peut être produite et sous quel délai approximatif — y compris lorsque la
      réponse est qu'elle n'existe pas encore.
- type: compare-table
  title: L'index
  text: 'Niveaux d''accès — Public : sur ce site. Accord de confidentialité : communiqué sous accord mutuel.
    Lorsqu''un numéro de certificat est marqué « accord », il est retenu par politique de communication,
    non parce que le certificat serait absent.'
