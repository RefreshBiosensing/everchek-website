- type: checklist
  title: Ce que nous signons pour votre homologation
  columns: 2
  items:
  - Lettre d'autorisation du fabricant désignant votre entité pour votre marché
  - Déclaration de conformité dans la forme acceptée par votre autorité
  - Certificat de vente libre lorsque le marché de destination l'exige
  - Le contrat technique entre votre établissement pharmaceutique et nous, lorsque le marché l'exige —
    comme en Algérie
  - Traductions de la notice et de l'étiquetage dans les langues exigées par votre dossier
  - Réponses écrites aux questions de l'autorité pendant l'instruction
- type: step-flow
  columns: 4
  title: Comment obtenir les documents
  items:
  - icon: pin
    title: Indiquez marché et voie
    desc: Homologation à l'import, montage local SKD ou appel d'offres — le jeu de documents diffère.
  - icon: doc
    title: Accord mutuel
    desc: Standard, deux pages, contresigné sous un jour ouvré en Chine.
  - icon: set
    title: Constitué selon votre check-list
    desc: Envoyez la check-list de votre autorité ou le cahier des charges ; nous travaillons à partir
      de là, pas d'un dossier générique.
  - icon: check
    title: Nous disons ce qui manque
    desc: Nous ne sommes pas certifiés sur tous les marchés. Interrogez-nous sur un marché précis et nous
      dirons ce qui existe, ce qui n'existe pas et la voie réaliste.
