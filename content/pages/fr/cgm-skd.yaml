- type: faq
  title: Questions fréquentes
  items:
  - q: Est-il difficile d'assembler un kit CGM en SKD ?
    a: L'assemblage est très simple. Chaque composant est doté d'un système d'encliquetage et un clic audible confirme
      la bonne mise en place de chaque pièce. Nous fournissons par ailleurs des instructions détaillées, des consignes
      de salle blanche, des procédures d'assurance qualité et une formation, pour un assemblage fluide et une performance
      fiable du dispositif.
  - q: Quelle est la différence entre le CGM en OEM et le CGM en SKD ?
    a: 'En OEM, nous fabriquons pour vous des dispositifs CGM entièrement finis et prêts à l''emploi, que vous commercialisez
      sous votre propre marque. La certification réglementaire du dispositif fini reste sous notre responsabilité et
      vous opérez selon un modèle distributeur/importateur. [TODO: CE status] En SKD, nous vous expédions des composants
      séparés : capteur, transmetteur, patch adhésif et applicateur. Vous les assemblez localement, ce qui réduit le
      volume expédié et abaisse les droits de douane, le SKD bénéficiant souvent de taux réduits. En contrepartie, vous
      devez obtenir votre propre licence locale de fabrication ou d''assemblage, réaliser les contrôles qualité finaux
      et assumer l''entière responsabilité réglementaire des produits CGM finis sur votre marché. L''OEM est plus simple,
      mais relativement plus coûteux. Le SKD est plus souple et peut réduire les droits d''importation ou satisfaire
      aux exigences de « fabriqué dans le pays », mais il ajoute des obligations réglementaires et de contrôle qualité.'
  - q: Proposez-vous un accompagnement réglementaire pour le SKD ?
    a: 'Oui. Pour nos partenaires SKD, nous fournissons la documentation technique et l''appui nécessaires à votre demande
      d''homologation locale : rapports de vérification des performances, évaluation de la biocompatibilité, preuves
      ISO 13485 et rapports d''essais aux normes IEC. Vous pilotez le dépôt sur votre marché ; nous fournissons le dossier
      qui le soutient.'
  - q: Puis-je obtenir l'exclusivité du marché sur un modèle CGM en SKD ?
    a: Oui, les partenariats CGM en SKD sont structurés avec une exclusivité régionale ou nationale, afin de protéger
      votre position sur le marché.
