  - type: richtext
    eyebrow: Cadre de décision
    title: "CGM ou BGM : un cadre de décision B2B pour les marques de santé"
    blocks:
      - text: >-
          Choisir entre CGM et BGM, c'est faire un pari stratégique sur l'évolution de votre gamme, de vos marges et de vos circuits de distribution. Le cadre qui suit écarte les effets d'annonce et détaille les données, les barrières à l'entrée et les modèles économiques, pour vous aider à trancher pour votre marque.
      - heading: Ce que disent réellement les données de marché
        text: >-
          Grand View Research évalue le marché mondial des dispositifs CGM à 13,4 milliards de dollars en 2025 et prévoit une croissance jusqu'à 41,4 milliards de dollars d'ici 2033, soit un TCAC de 15,1 %. Le même cabinet estime le marché mondial des dispositifs BGM à 15,53 milliards de dollars en 2025, en croissance plus lente que le CGM mais avec une demande qui reste soutenue.
    tint: true

  # Deux sous-titres opposés dans l'original : une comparaison à deux, pas une suite de blocs.
  - type: card-grid
    title: Les arbitrages entre technologie et marges
    text: >-
      Cette croissance plus rapide a un prix. Voici ce que coûte réellement chaque option, et ce qu'elle rapporte.
    columns: 2
    media: icon
    items:
      - icon: curve
        title: "CGM : forte croissance, mais une pente raide à gravir"
        text: >-
          Le potentiel de croissance du CGM s'accompagne de barrières bien réelles : R&D en biocapteurs, ingénierie du transmetteur sans fil et voie réglementaire iCGM qui exige un investissement clinique substantiel. Ces mêmes barrières protègent toutefois les marges une fois franchies. Un capteur CGM coûte généralement de 30 à 100 dollars à l'utilisateur final et doit être remplacé tous les 7 à 14 jours. Le modèle économique du CGM se rapproche donc structurellement d'un abonnement plutôt que d'une vente d'appareil unique.
      - icon: chart
        title: "BGM : demande stable, mais une guerre des prix"
        text: >-
          Le BGM reste incontournable dans les appels d'offres hospitaliers, sur les marchés à faibles ressources et auprès des segments sensibles au prix qui n'ont pas besoin d'une surveillance continue ou ne peuvent se l'offrir. Mais la faible barrière à l'entrée attire une concurrence nombreuse, et le prix des bandelettes subit une pression continue depuis des années. Une bandelette BGM se négocie généralement entre 0,20 et 1,00 dollar, une fraction du coût unitaire d'un capteur CGM, mais dégage aussi des marges bien plus minces.

