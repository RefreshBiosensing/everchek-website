  - type: richtext
    eyebrow: La voie du partenariat
    title: Lancez votre gamme CGM sans investissement lourd avec Refresh EverChek
    blocks:
      - text: >-
          Se lancer dans le CGM n'impose ni des années de R&D ni des millions d'investissement initial. Refresh EverChek est un système CGM étalonné en usine offrant une durée de port complète de 14 jours. Sur l'exactitude, nous publions la méthode plutôt qu'un chiffre isolé : méthode de référence, comparateur, ventilation par jour de port et par plage de glucose, la synthèse des performances cliniques étant communiquée aux partenaires qualifiés sous accord de confidentialité.
      - text: >-
          Plutôt que de bâtir cette compétence à partir de rien, vous pouvez vous appuyer sur nos cadres OEM/ODM souples ou déployer une solution SKD (semi-knocked-down). Ce modèle SKD permet aux marques régionales de localiser le montage, un atout décisif pour réduire les droits de douane à l'importation et satisfaire aux exigences des marchés publics locaux.
      - text: >-
          Nos clients à l'international sont généralement passés de la première prise de contact à une gamme CGM commercialisée en six à douze mois, bien en deçà des plusieurs années qu'exige habituellement un programme CGM développé de zéro.
      - text: >-
          Avec une intégration de données complète par API/SDK et une documentation réglementaire solide (conformité ISO 13485 et validations de biocompatibilité comprises), nous permettons aux marques de lancer en quelques mois, et non en quelques années, des produits CGM haut de gamme à leur propre marque.
