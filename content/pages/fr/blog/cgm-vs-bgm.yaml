  - type: faq
    title: Questions fréquentes
    items:
      - q: Quel est le décalage entre le BGM et le CGM ?
        a: >-
          Les valeurs du CGM accusent un retard de 5 à 15 minutes sur celles du BGM, car le glucose passe du sang vers le liquide interstitiel plus lentement qu'il ne varie dans la circulation sanguine.
      - q: Qu'est-ce que le MARD et pourquoi est-il important ?
        a: >-
          Le MARD (Mean Absolute Relative Difference) mesure l'exactitude d'un CGM en calculant l'écart moyen, en pourcentage, par rapport à une valeur de référence de laboratoire : plus le pourcentage est faible, plus l'exactitude est élevée. Un MARD inférieur ou égal à 10 % constitue le seuil de l'usage non adjuvant, c'est-à-dire la possibilité pour le patient d'adapter sa dose d'insuline sur la seule base des valeurs du CGM, sans confirmation par piqûre au doigt. Un MARD de 8 % est considéré comme une excellente performance de niveau professionnel, et un MARD inférieur à 8 % représente l'état de l'art de l'étalonnage en usine. Pour une marque de santé, un bon MARD est la donnée déterminante qui emporte la confiance des cliniciens et qualifie le produit pour les appels d'offres institutionnels face aux leaders du marché.
      - q: Quelles sont les classifications FDA du CGM et du BGM ?
        a: >-
          Le CGM relève de la catégorie iCGM (integrated CGM), qui suppose une approbation préalable à la mise sur le marché ; le BGM relève de l'autosurveillance glycémique (SBGM), soumise à des exigences moins strictes et généralement alignée sur la norme ISO 15197.
      - q: Quels sont les principaux défis de fabrication du CGM par rapport au BGM ?
        a: >-
          Le CGM impose un dépôt enzymatique précis, une stérilisation, l'assemblage d'un transmetteur sans fil et un contrôle qualité serré. La fabrication du BGM se concentre sur la régularité des bandelettes, la production à bas coût et la stabilité du conditionnement.
      - q: Quel marché croît le plus vite, celui du CGM ou celui du BGM ?
        a: >-
          Les deux progressent, mais le CGM plus vite. Grand View Research prévoit un marché des dispositifs CGM passant de 13,4 milliards de dollars en 2025 à 41,4 milliards d'ici 2033 (TCAC de 15,1 %), contre un marché BGM passant de 15,53 à 30,18 milliards de dollars sur la même période (TCAC de 8,8 %).
      - q: Le CGM peut-il remplacer le BGM pour l'adaptation des doses d'insuline ?
        a: >-
          La plupart des systèmes CGM modernes sont approuvés pour un usage non adjuvant : le patient peut adapter sa dose d'insuline sur la seule base des valeurs du CGM. Cela dit, de nombreux cliniciens recommandent encore une mesure de confirmation au BGM pour les décisions critiques ou à fort enjeu.
      - q: Comment le CGM et le BGM se comparent-ils en matière d'exploitation des données ?
        a: >-
          Le CGM génère environ 288 mesures par jour, ce qui rend possibles l'analyse de tendances et les analyses assistées par IA ; le BGM ne fournit généralement que 4 à 10 points de mesure par jour.
      - q: À quelle voie réglementaire faut-il s'attendre pour le CGM et pour le BGM ?
        a: >-
          Dans l'Union européenne, l'écart est tout aussi réel : le CGM est classé dispositif de classe IIb au titre du règlement MDR, ce qui impose l'intervention d'un organisme notifié et une investigation clinique obligatoire, tandis que le BGM relève du règlement IVDR en classe B, de moindre risque, par autodéclaration ou par évaluation de conformité avec un organisme notifié. Pour les marques qui adoptent un modèle CGM SKD avec EverChek, nous fournissons la documentation technique et clinique dont votre propre dossier d'homologation locale a besoin, puisque c'est la marque qui assume in fine la responsabilité réglementaire du dispositif fini.
      - q: Un fabricant peut-il produire à la fois du CGM et du BGM ?
        a: >-
          Oui, mais les deux exigent des lignes de production différentes, des compétences différentes et des dossiers réglementaires distincts. Le BGM est généralement plus simple à produire en interne ; le CGM, lui, réclame des capacités de R&D dont la plupart des entreprises ne disposent pas en propre. Un moyen de contourner cet obstacle est un modèle SKD comme celui d'EverChek : nous fournissons quelques composants CGM préassemblés — le cœur du capteur, le transmetteur, l'applicateur, le patch adhésif et la pile — et votre marque assure localement le montage final, le conditionnement et l'étiquetage, au lieu de développer de zéro la chimie du capteur ou les algorithmes d'étalonnage. Cette étape de montage local peut en outre ouvrir droit à des droits de douane réduits et satisfaire aux exigences de taux d'intégration locale dans les appels d'offres.
      - q: Comment choisir entre CGM et BGM pour mon activité ?
        a: >-
          Tout dépend du circuit visé : les hôpitaux privilégient souvent le BGM pour son coût et sa familiarité, tandis que le circuit officinal et la vente en ligne se tournent vers le CGM, plus rémunérateur et porté par une demande croissante des patients. Cela dit, le CGM s'impose comme la nouvelle tendance et l'occasion mérite d'être saisie. Envisagez une approche hybride : conservez le BGM pour la stabilité institutionnelle, mais lancez un pilote CGM pour la croissance grand public. Avec les solutions SKD ou OEM d'EverChek, vous pouvez ajouter le CGM sans R&D lourde, tester rapidement le marché, monter en volume à votre rythme et faire du modèle hybride un véritable avantage concurrentiel plutôt qu'une position de repli.

