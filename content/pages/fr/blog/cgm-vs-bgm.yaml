  - type: richtext
    eyebrow: Exactitude et réglementation
    title: L'exactitude comparée du CGM et du BGM
    blocks:
      - heading: Lequel des deux facilite le plus l'homologation ?
        text: >-
          Le MARD (Mean Absolute Relative Difference, écart relatif absolu moyen) est l'une des références du secteur pour évaluer l'exactitude d'un lecteur de glucose. Cet indicateur exprime, en pourcentage, l'écart moyen entre les valeurs d'un dispositif et une valeur de référence obtenue en laboratoire. Un dispositif affichant un MARD de 10 % s'écarte donc en moyenne de 10 % d'une mesure de laboratoire précise. Plus le MARD est bas, meilleure est l'exactitude ponctuelle. Une bonne valeur de MARD est indispensable à tout dossier réglementaire, à toute étude clinique et à toute campagne commerciale.
      - text: >-
          Sur ce critère, les systèmes CGM annoncent généralement un MARD compris entre 8 et 12 %, contre 5 à 6 % pour le BGM. Sur le papier, le BGM est donc plus exact. Les autorités et les cliniciens ont pourtant fini par accepter cet écart : les données de tendance continues d'un CGM permettent de signaler une chute rapide avant qu'elle ne devienne une urgence, ce qui a plus de valeur clinique qu'une mesure isolée un peu plus précise. Le CGM prend tout son sens lorsque vos utilisateurs finaux ont besoin d'être alertés tôt des variations rapides du glucose, en particulier des chutes vers l'hypoglycémie.
      - text: >-
          Aux États-Unis, les systèmes CGM visent la désignation « integrated continuous glucose monitor » (iCGM) de la FDA, tandis que les systèmes BGM relèvent en général de la catégorie des autotests de glycémie, par la voie mieux balisée du 510(k), avec une exactitude évaluée au regard de la norme ISO 15197.
      - text: >-
          Cela étant, un produit BGM peut souvent atteindre le marché sur la base d'une étude clinique plus légère et d'un budget réglementaire plus modeste. Un produit CGM visant le statut iCGM doit prévoir un calendrier plus long et un investissement plus lourd dans son système qualité avant d'encaisser la moindre recette.

