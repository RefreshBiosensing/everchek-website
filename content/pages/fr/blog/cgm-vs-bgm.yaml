    imageAlt: >-
      Histogramme du marché mondial des dispositifs CGM passant de 13,4 milliards de dollars en 2025 à 41,4 milliards d'ici 2033, face à une croissance plus lente du marché BGM
    ratio: 1312/736

  - type: card-grid
    title: Les critères à peser avant de choisir votre voie
    text: >-
      Alors, quelle voie prendre ? Pesez ces cinq critères au regard de la position réelle de votre organisation.
    columns: 3
    media: icon
    items:
      - icon: cog
        title: Maturité technologique
        text: >-
          Le CGM suppose de construire un capteur, une application, une logique d'alertes et une infrastructure de partage de données, et non seulement un capteur et un lecteur. Si votre équipe n'a jamais mis sur le marché de logiciel réglementé, cela change votre calendrier et votre budget.
      - icon: chart
        title: Investissement
        text: >-
          Le développement d'un CGM, les études cliniques et la voie iCGM exigent en général un budget nettement supérieur à celui d'un lancement BGM comparable.
      - icon: clock
        title: Calendrier réglementaire
        text: >-
          Le BGM atteint le marché plus vite par la voie classique du 510(k). La voie iCGM du CGM est plus longue et réclame davantage de preuves cliniques.
      - icon: globe
        title: Marché cible
        text: >-
          Les hôpitaux privilégient la simplicité et l'antériorité du BGM. Le circuit officinal et les consommateurs technophiles se tournent de plus en plus vers le CGM.
      - icon: curve
        title: Marges
        text: >-
          Le CGM offre un modèle de revenus récurrents aux marges plus confortables, mais un coût d'entrée plus élevé. Le BGM offre des marges plus minces, mais un accès au chiffre d'affaires plus rapide et moins coûteux.
    note: >-
      Règle empirique : si votre budget de R&D dépasse environ 5 millions de dollars et que vous disposez d'une véritable expertise capteurs en interne, le CGM mérite d'être mené en direct. Sinon, le BGM — ou un partenariat donnant accès à la technologie CGM — reste plus raisonnable que de bâtir cette compétence à partir de rien. Pour de nombreux fabricants, la vraie réponse est : les deux. Une stratégie hybride qui sert les appels d'offres hospitaliers en BGM tout en captant le marché CGM, plus rémunérateur, sous la même marque.

  - type: richtext
    eyebrow: Circuits de distribution
    title: Où ces produits se vendent et comment ils s'achètent
    blocks:
      - text: >-
          Les appels d'offres des hôpitaux et des cliniques penchent encore vers le BGM. Le coût, l'existence de codes de remboursement établis et l'habitude des équipes soignantes jouent tous en sa faveur dans l'achat institutionnel, même si le CGM progresse ailleurs. Dans ce circuit, les cahiers des charges pondèrent fortement le coût d'acquisition et la fiabilité de l'approvisionnement — deux critères qui favorisent la chaîne logistique plus simple et plus banalisée du BGM.
      - text: >-
          C'est dans le circuit officinal et la vente en ligne que se concentre la croissance du CGM. L'élargissement de la prise en charge, les produits CGM vendus directement au consommateur ou sans ordonnance et le renouvellement des capteurs par abonnement tirent tous la demande vers le CGM sur ces canaux. Pour un distributeur, le signal stratégique est clair : le CGM offre des marges supérieures et un chiffre d'affaires récurrent lié au renouvellement des capteurs, tandis que le BGM reste indispensable pour les appels d'offres hospitaliers et les marchés sensibles au prix.

  - type: richtext
    eyebrow: Réglementation et appels d'offres
    title: À quoi s'attendre côté réglementation et appels d'offres
    blocks:
      - text: >-
          Le BGM suit généralement une voie réglementaire plus simple (classe II, 510(k)) et dispose de codes de remboursement établis sur la plupart des grands marchés, ce qui rend l'achat public et la qualification aux appels d'offres relativement directs. Le CGM exige davantage de données cliniques pour obtenir une désignation iCGM ou équivalente, mais sa prise en charge progresse régulièrement, à mesure que les assureurs et les systèmes de santé nationaux reconnaissent sa valeur clinique pour les patients insulinodépendants.
      - text: >-
          Le parcours d'Abbott illustre bien cette transition. Abbott a bâti son activité diabète en fabricant de BGM classique, sous la marque FreeStyle. Sa première véritable tentative en CGM, le FreeStyle Navigator, lancé aux États-Unis vers 2008, était techniquement en avance sur son temps mais n'a pas trouvé son marché.
      - text: >-
          Abbott a néanmoins continué d'investir et a lancé en 2016-2017 le FreeStyle Libre, un CGM étalonné en usine qui ne demande pas d'étalonnage de routine par piqûre au doigt. Le Libre est devenu le système CGM le plus utilisé au monde, avec environ six millions d'utilisateurs : la preuve qu'un investissement soutenu, malgré un premier revers, peut encore déboucher sur le leadership d'une catégorie.

