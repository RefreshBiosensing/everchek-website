    imageAlt: >-
      Illustration conceptuelle opposant un capteur de mesure continue du glucose porté sur le corps à un lecteur de glycémie avec bandelettes et piqûre au doigt
    ratio: 1312/736
    text: >-
      En pratique, ce choix détermine votre calendrier de R&D, votre budget réglementaire, l'implantation de votre chaîne d'approvisionnement et le modèle de revenus que vous pourrez tenir dans la durée. Ce guide passe en revue tout ce qui sépare le CGM du BGM du point de vue strictement commercial, et vous montre comment ajouter le CGM à votre gamme avec le minimum d'efforts. Entrons dans le vif du sujet.

  - type: richtext
    eyebrow: Ce que mesure chaque dispositif
    title: La différence entre CGM et BGM
    blocks:
      - heading: Ce que mesurent réellement les valeurs CGM et BGM
        text: >-
          Le CGM mesure le glucose du liquide interstitiel sous la peau au moyen d'une électrode enzymatique implantée, et produit 288 mesures par jour sur une durée de port de 7 à 14 jours. Le BGM mesure le glucose du sang capillaire à l'aide de bandelettes à usage unique enduites de glucose oxydase, et ne fournit qu'un instantané isolé.
      - text: >-
          Le glucose met un certain temps à diffuser du sang vers le liquide interstitiel : la valeur du BGM est donc quasi instantanée, tandis que le CGM accuse généralement un décalage de 5 à 15 minutes. Un CGM affichera donc souvent une valeur inférieure à celle d'un BGM relevé au même instant juste après un repas, lorsque la glycémie monte vite, et une valeur supérieure après une injection d'insuline, lorsqu'elle redescend. Même patient, même instant, deux chiffres différents — et tous deux « corrects » au regard de ce qu'ils mesurent.
      - text: >-
          Si vous fabriquez un CGM, ce décalage doit être intégré à l'algorithme d'étalonnage. Si vous le commercialisez, il faut former le support client et rédiger la notice d'utilisation en conséquence, sous peine de voir votre service client saturé de réclamations du type « mon CGM se trompe ».

  - type: image-text
    variant: top
    image: /blog/cgm-vs-bgm-images/02_continuous_vs_point.webp
    imageAlt: >-
      Graphique comparant une courbe de glucose continue issue d'un CGM aux mesures ponctuelles dispersées d'un lecteur de glycémie sur une journée
    ratio: 1312/736

