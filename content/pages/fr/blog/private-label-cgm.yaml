        title: Une exactitude validée cliniquement, énoncée avec sa méthode
        text: >-
          La plateforme CGM EverChek repose sur une technologie de biocapteur électrochimique éprouvée. Nous publions la manière dont l'exactitude est mesurée — méthode de référence, comparateur, ventilation par jour de port et par plage de glucose — et communiquons la synthèse des performances cliniques aux partenaires qualifiés sous accord de confidentialité. Demandez-nous le protocole avant de nous demander le chiffre : c'est le protocole qui dit si le chiffre veut dire quelque chose.
      - icon: set
        title: Une coopération souple, à plusieurs niveaux
        text: >-
          Que vous ayez besoin d'un déploiement rapide et économique en marque blanche pour valider un marché, d'une conception OEM sur mesure pour différencier votre marque, ou d'un cadre structuré de livraison de composants SKD pour un montage local, nos équipes s'adaptent entièrement à votre modèle opérationnel.
      - icon: flower
        title: Une personnalisation de bout en bout
        text: >-
          Nous ne nous contentons pas de coller des logos. Nous proposons une localisation approfondie : conditionnement de vente, documentation en langue locale, logique d'alertes personnalisée et cadres complets d'application mobile en marque blanche, prêts pour la production.
      - icon: factory
