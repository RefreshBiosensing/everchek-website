  - type: richtext
    eyebrow: Choix du fournisseur
    title: Comment choisir le bon fabricant de CGM en marque blanche
    blocks:
      - text: >-
          Votre partenaire industriel est le poumon de votre marque. Lorsque vous évaluez des fournisseurs, dépassez la simple grille tarifaire et jugez-les sur ces piliers techniques et opérationnels.
      - heading: Exactitude clinique (MARD)
        text: >-
          L'indicateur de référence de l'exactitude d'un CGM est le MARD (Mean Absolute Relative Difference). Il mesure l'écart moyen, en pourcentage, entre la valeur affichée par le CGM et une valeur de glucose de référence obtenue en laboratoire. Plus le chiffre est bas, meilleur il est. Une plateforme CGM fiable et cliniquement pertinente doit démontrer de manière constante un MARD inférieur à 9 %. Exigez des données d'essais cliniques évaluées par des pairs ou des rapports d'évaluation formels — et demandez le protocole de mesure derrière le chiffre, car un MARD sans sa méthode de référence, son comparateur et sa ventilation par plage de glucose ne vous apprend pas grand-chose.
      - heading: Stabilité et capacité industrielles
        text: >-
          Une rupture d'approvisionnement peut détruire une marque grand public du jour au lendemain. Auditez la classification des salles blanches du fabricant, sa capacité de production quotidienne et ses accords d'approvisionnement en composants. Assurez-vous qu'il pourra suivre lorsque vos volumes de vente auront triplé.
      - heading: Profondeur du dossier réglementaire
        text: >-
          Le fabricant est-il en mesure de fournir un dossier technique complet et bien structuré ? Cherchez un partenaire capable de vous remettre les certificats ISO 13485, des données de biocompatibilité complètes, les rapports de validation de la stérilisation et des dossiers de vérification logicielle solides. Si sa documentation est lacunaire, votre procédure d'homologation locale tournera au cauchemar.
      - heading: Engagement de R&D dans la durée
        text: >-
          Le paysage du CGM évolue vite. Vous ne voulez pas d'un partenaire dont la technologie sera obsolète dans deux ans. Choisissez un partenaire doté d'une feuille de route de R&D active, qui innove régulièrement en matière de durée de port, de miniaturisation, de mesure multi-analytes (lactate, cétones) et d'exactitude algorithmique.

