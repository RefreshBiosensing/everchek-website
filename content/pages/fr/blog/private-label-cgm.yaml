  - type: step-flow
    title: Comment se déroule concrètement un projet de CGM en marque blanche
    columns: 3
    items:
      - icon: pin
        title: "Phase 1 : cadrage et analyse réglementaire"
        desc: >-
          Le projet commence par la cartographie de vos marchés géographiques cibles, l'identification des classifications de dispositifs médicaux applicables localement et l'évaluation des volumes attendus pour les premières phases de lancement.
      - icon: set
        title: "Phase 2 : configuration et sélection"
        desc: >-
          Vous passez en revue le portefeuille technologique du fabricant pour choisir les caractéristiques matérielles de base (durée de port du capteur, besoins d'étalonnage, etc.) et définir le périmètre d'intégration logicielle.
      - icon: flower
        title: "Phase 3 : intégration de la marque et création des supports"
        desc: >-
          Votre équipe de design travaille avec les ingénieurs du fabricant pour finaliser les tracés de découpe du conditionnement, les textes de notice, les étiquettes réglementaires et les fichiers localisés des applications iOS et Android.
      - icon: check
        title: "Phase 4 : évaluation et validation des échantillons"
        desc: >-
          Le fabricant produit une série d'échantillons physiques à votre marque et fournit les fichiers de documentation technique correspondants. Votre équipe évalue le kit et valide l'échantillon de référence définitif.
      - icon: factory
        title: "Phase 5 : production et assurance qualité"
        desc: >-
          La commande passe en production de série dans un site médical certifié, en salle blanche, exploité selon les exigences du système de management de la qualité ISO 13485. Chaque lot fait l'objet d'une validation électrochimique et d'une validation des performances sans fil.
      - icon: box
        title: "Phase 6 : préparation de commande et logistique"
        desc: >-
          Les produits finis, stériles et prêts à la vente sont conditionnés, soumis aux contrôles qualité à l'export, puis expédiés vers vos centres de distribution régionaux.
    tint: true

  - type: image-text
