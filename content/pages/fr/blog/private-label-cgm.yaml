  - type: faq
    title: Questions fréquentes
    items:
      - q: Qu'est-ce qu'un CGM en marque blanche ?
        a: >-
          Un CGM en marque blanche est un montage dans lequel un fabricant certifié construit un système de mesure continue du glucose entièrement validé, que vous commercialisez ensuite sous le nom, le conditionnement et l'interface applicative de votre propre entreprise.
      - q: La marque blanche est-elle différente de l'OEM ?
        a: >-
          Oui. La marque blanche reprend la forme matérielle et les composants internes existants du fabricant, et concentre la personnalisation sur l'identité de marque, le conditionnement et l'habillage logiciel. L'OEM vous permet d'introduire un design industriel propre, des boîtiers spécifiques ou des fonctions matérielles exclusives, bâtis sur la plateforme de biocapteur du fabricant.
      - q: Ai-je le droit de vendre un CGM sous ma propre marque ?
        a: >-
          Tout à fait. C'est une pratique commerciale courante dans l'industrie du dispositif médical à l'échelle mondiale. Votre entité doit toutefois se conformer à la réglementation sanitaire de votre pays, ce qui suppose généralement de vous enregistrer comme distributeur ou responsable de la mise sur le marché du dispositif, en vous appuyant sur le dossier technique du fabricant.
      - q: Dois-je développer ou fabriquer mon propre capteur ?
        a: >-
          Non. Votre partenaire industriel prend en charge l'électrochimie complexe, la production stérile en salle blanche, le micro-assemblage automatisé et les essais de validation clinique.
      - q: Puis-je personnaliser l'interface et les fonctions de l'application mobile ?
        a: >-
          Oui. Vous pouvez personnaliser l'identité visuelle, les couleurs, l'emplacement du logo, les traductions et les seuils d'alerte de glucose par défaut. Des intégrations avancées par API sont également disponibles pour relier les flux de données directement à vos propres plateformes logicielles.
      - q: Quelles certifications médicales faut-il exiger ?
        a: >-
          Au minimum, assurez-vous que votre partenaire industriel détient une certification ISO 13485 en cours de validité pour le système de management de la qualité des dispositifs médicaux. Selon votre marché cible, recherchez également les homologations déjà obtenues, les autorisations réglementaires locales ainsi que des rapports complets de biocompatibilité et de stérilisation — et demandez quel organisme a délivré chaque document et quel périmètre il couvre.
      - q: Une jeune entreprise peut-elle réussir le lancement d'un CGM en marque blanche ?
        a: >-
          Oui, à condition de disposer d'une stratégie d'acquisition d'utilisateurs établie, de circuits d'orientation clinique ou d'une proposition de valeur logicielle distinctive (par exemple une application spécialisée d'accompagnement métabolique) qui exploite les données du dispositif.
      - q: Comment évaluer et choisir le bon partenaire industriel ?
        a: >-
          Privilégiez les indicateurs d'exactitude clinique (un MARD inférieur à 9 %, publié avec le protocole utilisé pour le mesurer), un historique avéré de régularité de fabrication, la profondeur et l'organisation du dossier technique réglementaire, ainsi que la volonté d'assurer un soutien technique et logiciel dans la durée.

  - type: cta-banner
