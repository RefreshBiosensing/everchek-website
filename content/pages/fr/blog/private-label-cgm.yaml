  - type: card-grid
    title: Pourquoi choisir EverChek pour votre CGM en marque blanche
    text: >-
      Chez EverChek, nous proposons une solution clé en main, fluide et fiable, conçue pour mener votre marque du concept au lancement commercial en toute confiance.
    columns: 2
    media: icon
    items:
