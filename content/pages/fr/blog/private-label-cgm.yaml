        text: >-
          Nous fournissons à nos partenaires internationaux des dossiers documentaires rigoureux, des transferts de données techniques et un conseil d'ingénierie dédié, afin que votre procédure d'homologation locale avance sans heurts.
    note: >-
      Si vous hésitez entre marque blanche, OEM et SKD pour votre marché et vos volumes, dites-nous simplement où vous en êtes. Nous ferons le point avec vous directement.
