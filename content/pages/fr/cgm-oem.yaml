- type: card-grid
  media: icon
  columns: 2
  dark: true
  title: Ce qui nous distingue
  text: Notre intégration verticale et notre expertise technique nous distinguent des fournisseurs OEM traditionnels.
  items:
  - icon: console
    title: Intégration applicative sans friction
    text: Que vous souhaitiez créer une application CGM autonome ou enrichir un écosystème de santé existant, notre système
      CGM s'intègre à votre infrastructure via API ou SDK, avec un effort de développement minimal.
  - icon: chart
    title: Une structure de coûts favorable
    text: Notre stratégie de développement verticalement intégrée couvre en interne les puces de capteur, la conception
      algorithmique et les composants clés du système. Elle permet une meilleure maîtrise des coûts, un approvisionnement
      stable et des conditions plus compétitives pour votre activité CGM.
  - icon: check
    title: Une qualité produit fiable
    text: Nous appliquons la maîtrise statistique des procédés (SPC) tout au long de la fabrication afin de surveiller,
      contrôler et optimiser la qualité en temps réel. Cela réduit la variabilité entre lots en production CGM à grande
      échelle.
  - icon: handshake
    title: Un support technique continu
    text: Le CGM en OEM ne se limite pas à fabriquer et étiqueter. De l'intégration applicative au développement des
      moules, en passant par l'ordonnancement de la production et les demandes de fonctions spécifiques, nos équipes
      techniques et opérationnelles travaillent au plus près des vôtres pour faire avancer le projet à chaque étape.
- type: card-grid
  media: icon
  columns: 4
  title: Pour qui fabriquons-nous ?
  text: Du fabricant de dispositifs médicaux à l'organisme de recherche clinique, notre modèle OEM sert des acteurs de
    santé très divers.
  items:
  - icon: factory
    title: Fabricants de dispositifs médicaux
    text: Élargir sa gamme au CGM sans développer une technologie de capteur ni des algorithmes propres.
  - icon: cloud
    title: Plateformes de santé numérique
    text: Intégrer les données CGM en temps réel aux plateformes de télésanté et de suivi à distance des patients, pour
      une prise en charge continue.
  - icon: briefcase
    title: Laboratoires pharmaceutiques
    text: Intégrer le CGM aux programmes de prise en charge du diabète et aux écosystèmes de thérapies numériques.
  - icon: curve
    title: Acteurs de la pompe à insuline et de l'écosystème du diabète
    text: Rendre possible la gestion du diabète en boucle fermée en associant le CGM aux systèmes d'administration d'insuline.
  - icon: box
    title: Grands distributeurs créant leur marque propre
    text: Passer de la revente de marques tierces à des produits CGM à votre marque. Vous améliorez vos marges et votre
      positionnement de long terme.
    href: /fr/distribution-cgm/
    linkLabel: Partenariats de distribution
  - icon: chart
    title: Investisseurs et fonds spécialisés en santé
    text: Accélérer la commercialisation du CGM grâce à une infrastructure OEM déjà en place et à un déploiement plus
      rapide.
  - icon: hospital
    title: Hôpitaux et réseaux de soins
    text: Déployer le CGM en hospitalisation, en gestion des maladies chroniques et dans les programmes de santé des
      populations.
  - icon: data
    title: Recherche clinique et CRO
    text: Utiliser des systèmes CGM pour les essais cliniques, la recherche métabolique et le suivi longitudinal des
      patients, afin de produire des jeux de données glucose validés.
- type: faq
  title: Questions sur le CGM en OEM
  items:
  - q: Pouvons-nous personnaliser la langue de l'application CGM ?
    a: Oui. Nous assurons une prise en charge multilingue complète de l'application CGM, de l'emballage et de la documentation
      produit. Nous réalisons l'ensemble du travail technique ; vous n'avez qu'à ajouter votre logo et votre identité
      de marque.
  - q: Pouvons-nous modifier les seuils d'alerte glycémique dans l'application ?
    a: Tout à fait. Vous pouvez définir et ajuster les seuils d'alerte glycémique — limites d'hypoglycémie et d'hyperglycémie,
      alertes fondées sur la tendance — dans la configuration de votre application.
  - q: Proposez-vous des formes d'adhésif ou des formats de capteur sur mesure ?
    a: Oui. Des formes d'adhésif et des formats de capteur spécifiques sont possibles pour soutenir votre stratégie de
      différenciation produit.
  - q: Pouvons-nous exporter les données de glucose des patients pour notre recherche ou notre DPI ?
    a: Oui. Nous vous donnons accès aux valeurs de glucose, aux données de tendance et aux journaux d'événements des
      patients via SDK et API ; ces données peuvent être exportées pour une intégration au dossier patient informatisé
      (DPI) ou pour un usage de recherche interne.
  - q: Quelle est la différence entre le CGM en OEM et le CGM en SKD ?
    a: En OEM, nous fabriquons le CGM fini, prêt à la vente, que vous commercialisez sous votre propre marque en qualité
      d'importateur ou de distributeur. En SKD, vous recevez des kits partiellement assemblés et réalisez l'assemblage
      final, le conditionnement et l'étiquetage dans votre pays, ce qui peut permettre au produit d'être reconnu comme
      fabriqué localement. Le SKD offre des avantages en matière d'intégration locale, mais ajoute des obligations de
      licence et de qualité sur place.
