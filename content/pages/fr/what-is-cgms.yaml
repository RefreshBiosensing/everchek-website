title: Qu’est-ce qu’un CGM ? Mesure continue du glucose | EverChek
description: "Comment fonctionne un système de mesure continue du glucose (CGM), en quoi il diffère du test capillaire, et les voies OEM, SKD et distribution."
path: /fr/qu-est-ce-qu-un-cgm/
translationKey: what-is-cgms
sections:
  - type: hero
    variant: centered
    backgroundImage: /images/5.webp
    title: Qu’est-ce qu’un système de mesure continue du glucose (CGM) ?
    sub: >-
      Un système de mesure continue du glucose (CGM) est un dispositif médical qui suit les niveaux de
      glucose en temps réel au moyen d’un petit capteur porté sous la peau. Contrairement au test
      capillaire traditionnel par piqûre au doigt, qui ne fournit qu’une valeur ponctuelle, le CGM
      produit des données continues : il montre les tendances, les profils et les alertes en cas
      d’hyperglycémie ou d’hypoglycémie — ce qui aide les professionnels de santé et les patients à
      prendre des décisions thérapeutiques mieux informées et plus anticipatives.
    buttons:
      - label: Demandez quel modèle de partenariat CGM convient à votre marché
        href: /fr/contact/
      - label: Voir les spécifications du dispositif CGM
        href: /fr/systeme-mesure-continue-glucose/
        style: ghost

  - type: image-text
    variant: left
    title: Comment fonctionne un système CGM ?
    image: /images/cgm-sensor-skin-diagram.svg
    imageAlt: >-
      Coupe de la peau montrant le filament du capteur CGM atteignant le liquide interstitiel sous
      l’épiderme et le derme, le transmetteur restant à la surface de la peau
    ratio: 4/3
    fit: contain
    steps:
      - Une fois le CGM appliqué sur le bras, le capteur commence à fonctionner sous la peau.
      - >-
        Le capteur contient des biomatériaux qui réagissent avec le glucose du liquide interstitiel.
        Ces réactions génèrent des signaux biochimiques, détectés puis convertis en valeurs de
        glucose toutes les quelques minutes.
      - Le transmetteur envoie ensuite ces données à votre application mobile ou à votre récepteur.
      - >-
        Vous pouvez ainsi consulter les tendances glycémiques, recevoir des alertes haute et basse et
        suivre les variations tout au long de la journée.
    note: >-
      À noter : le glucose passe naturellement du sang vers le liquide interstitiel : les valeurs
      mesurées dans le liquide interstitiel reflètent donc étroitement la glycémie sanguine.
    tint: true

