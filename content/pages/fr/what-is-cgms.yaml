  - type: card-grid
    title: Les signaux de marché qui portent la croissance du CGM
    text: >-
      L’épidémie mondiale de diabète et la hausse des dépenses de santé accélèrent la demande de
      solutions de surveillance continue.
    columns: 4
    media: stat
    center: true
    tint: true
    items:
      - kicker: 589M+
        title: Adultes vivant avec le diabète dans le monde
        text: >-
          Le nombre d’adultes vivant avec le diabète a plus que triplé depuis 2000, sous l’effet du
          vieillissement des populations, de la progression de l’obésité et de modes de vie de plus en
          plus sédentaires, dans les pays développés comme dans les pays en développement.
        source:
          label: "Source : IDF Diabetes Atlas"
          href: https://idf.org/about-diabetes/diabetes-facts-figures/
      - kicker: $1T+
        title: Dépenses de santé annuelles mondiales liées au diabète
        text: >-
          Le diabète représente une part importante et croissante des dépenses de santé mondiales :
          médicaments, dispositifs, hospitalisations et gestion des complications de long terme, dans
          toutes les régions.
        source:
          label: "Source : IDF Diabetes Atlas"
          href: https://idf.org/about-diabetes/diabetes-facts-figures/
      - kicker: 853M+
        title: Adultes diabétiques projetés à l’horizon 2050
        text: >-
          Sans intervention significative, le nombre d’adultes diabétiques devrait continuer à
          progresser fortement, créant une demande durable en outils avancés de surveillance et de
          prise en charge.
        source:
          label: "Source : IDF Diabetes Atlas"
          href: https://idf.org/about-diabetes/diabetes-facts-figures/
      - kicker: $13.4B
        title: Taille du marché mondial du CGM en 2025
        text: >-
          Le marché des dispositifs CGM a atteint une valeur estimée à 13,38 milliards USD en 2025,
          dont 5,6 milliards USD pour les seuls États-Unis, portée par des politiques de remboursement
          favorables et par l’adoption croissante dans le diabète de type 2.
        source:
          label: "Source : Grand View Research"
          href: https://www.grandviewresearch.com/industry-analysis/continuous-glucose-monitoring-market
      - kicker: 16.3%
        title: TCAC prévu 2026–2035
        text: >-
          Le marché du CGM devrait croître à un taux de croissance annuel composé de 16,3 % de 2026 à
          2035, dépassant la plupart des autres segments du dispositif médical et traduisant une
          adoption mondiale qui s’accélère.
        source:
          label: "Source : GM Insights"
          href: https://www.gminsights.com/industry-analysis/continuous-glucose-monitoring-market
      - kicker: $41.4B
        title: Taille projetée du marché du CGM à l’horizon 2033
        text: >-
          Le marché mondial des dispositifs CGM devrait presque tripler par rapport à son niveau de
          2025 et atteindre 41,41 milliards USD en 2033, à mesure que les technologies non invasives et
          les analyses assistées par IA portent la génération suivante d’adoption.
        source:
          label: "Source : Grand View Research"
          href: https://www.grandviewresearch.com/industry-analysis/continuous-glucose-monitoring-market
      - kicker: 50.5%
        title: Patients diabétiques n’atteignant pas les objectifs glycémiques
        text: >-
          Malgré les progrès thérapeutiques, seule la moitié environ des personnes diabétiques atteint
          les objectifs glycémiques recommandés — ce qui souligne le besoin urgent de meilleures
          solutions de surveillance continue.
        source:
          label: "Source : ADA Clinical Diabetes"
          href: https://diabetesjournals.org/clinical/article/43/3/399/158023
      - kicker: 4.2%
        title: Rythme de progression de la prévalence mondiale du diabète
        text: >-
          La prévalence du diabète continue de progresser d’environ 4,2 % par an dans les régions en
          développement, sous l’effet de l’urbanisation, des changements alimentaires et du
          vieillissement des populations — ce qui élargit le marché adressable du CGM.
        source:
          label: "Source : IDF Diabetes Atlas"
          href: https://idf.org/about-diabetes/diabetes-facts-figures/

  - type: card-grid
    title: Le CGM en vaut-il la peine pour les acteurs de santé ?
    text: >-
      Ajouter le CGM à votre portefeuille santé crée de la valeur clinique et commerciale sur
      plusieurs plans.
    columns: 3
    media: icon
    center: true
    items:
      - icon: shield
        title: Conserver vos parts de marché
        text: >-
          À mesure que l’adoption du CGM progresse, proposer des solutions CGM aide votre activité à
          rester compétitive sur un marché du diabète en pleine évolution et à répondre à des attentes
          clients qui changent.
      - icon: box
        title: Élargir votre gamme
        text: >-
          Ajoutez le CGM à votre portefeuille existant en diabète, en diagnostic ou en maladies
          chroniques, en créant de la valeur supplémentaire pour vos clients et de nouvelles
          opportunités de croissance.
      - icon: chart
        title: Développer votre chiffre d’affaires
        text: >-
          Les systèmes CGM reposent sur des capteurs jetables généralement remplacés tous les 14 jours,
          ce qui vous permet de bénéficier de commandes récurrentes continues plutôt que d’achats
          ponctuels.
      - icon: heart
        title: Améliorer la prise en charge des patients
        text: >-
          Le CGM apporte des informations glycémiques fondées sur les tendances plutôt que sur des
          mesures isolées, ce qui aide les médecins et les équipes soignantes à décider en connaissance
          de cause.
      - icon: hospital
        title: Améliorer l’efficience clinique
        text: >-
          Vous pouvez réduire la dépendance à des contrôles glycémiques dispersés et intégrer les
          données de glucose en continu dans les parcours de santé numériques, améliorant le suivi des
          patients au-delà des consultations en présentiel.
      - icon: curve
        title: Soutenir la surveillance préventive
        text: >-
          Le CGM permet aux équipes soignantes de suivre en continu les variations glycémiques des
          patients et d’identifier les profils anormaux avant qu’ils ne s’aggravent.

