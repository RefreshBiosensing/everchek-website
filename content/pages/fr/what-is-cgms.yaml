  - type: faq
    title: Questions sur la mesure continue du glucose
    items:
      - q: Qu’est-ce qu’un système de mesure continue du glucose (CGM) ?
        a: >-
          Un CGM est un dispositif médical qui suit les niveaux de glucose en temps réel au moyen d’un
          petit capteur porté sous la peau. Au lieu d’une valeur unique à un instant donné, il produit
          des données continues — tendances, profils et alertes en cas d’hyperglycémie ou
          d’hypoglycémie — pour que cliniciens et patients prennent des décisions thérapeutiques mieux
          informées et plus anticipatives.
      - q: En quoi le CGM diffère-t-il du test glycémique traditionnel par piqûre au doigt ?
        a: >-
          Le test par piqûre au doigt donne des mesures ponctuelles isolées, réalisées manuellement et
          relues en consultation. Un CGM fournit des valeurs en temps réel, des tendances glycémiques,
          des alertes haute et basse, des alertes prédictives, une visibilité des données sur le long
          terme et la télésurveillance des patients — les décisions thérapeutiques reposent ainsi sur
          un historique glycémique continu plutôt que sur un instantané.
      - q: Un capteur CGM mesure-t-il directement la glycémie sanguine ?
        a: >-
          Non. Le capteur est placé sous la peau et réagit avec le glucose du liquide interstitiel, en
          convertissant le signal biochimique en valeur de glucose toutes les quelques minutes. Comme
          le glucose passe naturellement du sang vers le liquide interstitiel, les valeurs
          interstitielles reflètent étroitement la glycémie sanguine.
      - q: À quelle fréquence remplace-t-on un capteur CGM ?
        a: >-
          Les systèmes CGM reposent sur des capteurs jetables généralement remplacés tous les 14 jours.
          Pour un distributeur ou une marque de santé, c’est la caractéristique commerciale qui compte
          le plus : l’activité repose sur des commandes récurrentes continues plutôt que sur des achats
          d’appareils ponctuels.
      - q: Comment une marque de santé peut-elle commencer à vendre du CGM ?
        a: >-
          Il existe trois voies habituelles. Le SKD fournit des kits partiellement assemblés pour le
          montage, le conditionnement et l’étiquetage locaux sous votre propre marque. L’OEM confie à
          EverChek la fabrication du système complet à votre marque et selon vos spécifications. La
          distribution vous permet de vendre des produits EverChek prêts à commercialiser via votre
          réseau de vente existant, sans aucune capacité d’assemblage requise.

