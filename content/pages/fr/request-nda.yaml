title: Demander un accord de confidentialité | EverChek
description: Engagez un accord de confidentialité mutuel avec EverChek pour recevoir numéros de certificat, rapports d'essais et synthèse de performance clinique.
path: /fr/accord-de-confidentialite/
translationKey: request-nda
sections:
  - type: hero
    variant: standard
    kicker: Deux pages · Mutuel · Contresigné sous un jour ouvré en Chine
    title: Demander un accord de confidentialité mutuel
    sub: |
      Les numéros de certificat, les rapports d'essais, la synthèse de performance clinique et le dossier
      technique complet sont communiqués sous accord de confidentialité mutuel — non pas parce qu'ils
      sont difficiles à obtenir, mais parce que votre dossier d'homologation en a besoin et qu'une page
      web publique n'est pas le bon endroit pour les publier.
    buttons:
      - label: Consulter d'abord l'index du dossier
        href: /fr/index-dossier-reglementaire/
        style: ghost

  - type: text-checks
    title: Ce que l'accord vous donne
    text: L'accord est mutuel et n'engage à aucun achat. Il existe pour que vos affaires réglementaires puissent nous évaluer sérieusement, et pour que ce que vous nous dites de votre stratégie de marché reste chez nous. À ce stade nous ne demandons ni engagement d'achat, ni prévision de volume, ni discussion d'exclusivité — cela se passe mieux une fois que votre équipe réglementaire a lu le dossier.
    points:
      - Numéros de certificat, organismes émetteurs, périmètres et dates de validité
      - Rapports d'essais de sécurité biologique, CEM, sécurité électrique et étanchéité
      - Synthèse de performance clinique, avec sa méthode de référence et son protocole
      - Données de stabilité et de durée de conservation
      - Fiche technique produit et notice d'utilisation
      - Lettres d'autorisation du fabricant et déclarations de conformité pour votre marché

  - type: step-flow
    columns: 4
    title: Comment cela se passe
    items:
      - icon: mail
        title: Vous envoyez ce formulaire
        desc: Votre entité, votre marché, et s'il s'agit d'une homologation à l'import, d'un montage local ou d'un appel d'offres. Le jeu de documents diffère.
      - icon: doc
        title: Nous envoyons l'accord
        desc: Deux pages, mutuel, clauses standard. Si votre service juridique préfère son propre modèle, envoyez-le — nous étudierons le vôtre plutôt que d'imposer le nôtre.
      - icon: check
        title: Contresigné
        desc: Sous un jour ouvré en Chine (lun.–ven., UTC+8) après réception de votre signature.
      - icon: set
        title: Constitué selon votre check-list
        desc: Envoyez-nous la check-list de votre autorité ou le cahier des charges de l'appel d'offres ; nous travaillons à partir de là, et non d'un dossier générique que vous devriez ensuite trier.

  - type: richtext
    title: Ce que nous ne ferons pas
    blocks:
      - text: Nous n'enverrons pas un dossier laissant croire à une couverture que nous n'avons pas. Si vous nous interrogez sur un marché où nous n'avons ni enregistrement ni voie réaliste, nous vous le dirons dès la première réponse, et non au quatrième mois. Un fournisseur qui prétend couvrir toutes les juridictions est un fournisseur qui ne les a pas lues.

  - type: contact-form
