# ⚠️ Generated file — do not edit by hand.
# Edit scripts/build-cms-config.mjs, then run: npm run cms:config
#
# base_url must point at the deployed sveltia-cms-auth Worker, or sign-in fails.
backend:
  name: github
  repo: RefreshBiosensing/everchek-website
  branch: main
  base_url: https://sveltia-cms-auth.yanhuarong.workers.dev
media_folder: public/images
public_folder: /images
publish_mode: editorial_workflow
editor:
  preview: false
collections:
  - name: pages_en
    label: Pages (EN)
    icon: article
    folder: content/pages/en
    extension: yaml
    format: yaml
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{path}}"
    editor:
      preview: false
    fields:
      - label: Title tag
        name: title
        widget: string
        hint: ≤60 chars · keyword first · end with | EverChek
      - label: Meta description
        name: description
        widget: text
        hint: 140–160 chars · keyword + a reason to click
      - label: URL path (改了会断链，慎改)
        name: path
        widget: string
        hint: e.g. /products/x/ — localised slugs welcome
      - label: Translation key (links locales for hreflang)
        name: translationKey
        widget: string
        required: false
        hint: Same key across locales = same page in different languages
      - label: Hide from search engines (noindex)
        name: noindex
        widget: boolean
        required: false
        default: false
      - label: Structured data
        name: schemaType
        widget: select
        options:
          - label: Product page
            value: product
        required: false
      - label: Sections (drag to reorder · + to add)
        name: sections
        widget: list
        label_singular: Section
        types:
          - label: 🏔 Hero (page top, owns the H1)
            name: hero
            widget: object
            summary: "Hero: {{fields.title}}"
            fields:
              - label: Variant
                name: variant
                widget: select
                options:
                  - label: Standard (left copy)
                    value: standard
                  - label: Centered
                    value: centered
                  - label: Dark banner
                    value: dark
                  - label: Split (copy + visual)
                    value: split
                  - label: Copy + enquiry form
                    value: form
                required: false
                default: standard
              - label: Eyebrow (hidden site-wide)
                name: eyebrow
                widget: string
                required: false
              - label: Kicker pill (visible)
                name: kicker
                widget: string
                required: false
              - label: Headline (H1) — must contain the page keyword
                name: title
                widget: string
              - label: Subheading
                name: sub
                widget: text
                required: false
              - label: Buttons
                name: buttons
                widget: list
                fields:
                  - label: Label
                    name: label
                    widget: string
                  - label: Link
                    name: href
                    widget: string
                  - label: Style
                    name: style
                    widget: select
                    options:
                      - primary
                      - ghost
                    required: false
                    default: primary
                required: false
              - label: Stats strip
                name: stats
                widget: list
                fields:
                  - label: Value
                    name: value
                    widget: string
                  - label: Label
                    name: label
                    widget: string
                required: false
              - label: Badges (pills)
