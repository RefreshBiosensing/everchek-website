<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="DM Sans Variable, DM Sans, Inter, system-ui, sans-serif" role="img"><title>An SKD kit supplies the technology a healthcare brand does not have</title><text x="56" y="34" font-size="11.5" fill="#8A97A6" font-weight="700" text-anchor="start" letter-spacing="1.1">YOU HAVE THE MARKET · THE TECHNOLOGY IS THE GAP</text><rect x="56" y="56" width="366" height="150" rx="10" fill="#E3F0FA" stroke="#80BCE2" stroke-width="1.5"/><text x="84" y="90" font-size="15" fill="#0A4C84" font-weight="700" text-anchor="start" letter-spacing="0">You already have</text><path d="M87 116 l3.6 3.9 l7.6 -8.6" stroke="#0B5FA5" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="112" y="121" font-size="13.5" fill="#0A4C84" font-weight="400" text-anchor="start" letter-spacing="0">Brand recognition</text><path d="M87 146 l3.6 3.9 l7.6 -8.6" stroke="#0B5FA5" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="112" y="151" font-size="13.5" fill="#0A4C84" font-weight="400" text-anchor="start" letter-spacing="0">A distribution network</text><path d="M87 176 l3.6 3.9 l7.6 -8.6" stroke="#0B5FA5" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="112" y="181" font-size="13.5" fill="#0A4C84" font-weight="400" text-anchor="start" letter-spacing="0">Clinical relationships</text><rect x="458" y="56" width="366" height="150" rx="10" fill="#EEF1F4" stroke="#DCE1E6" stroke-width="1.5"/><text x="486" y="90" font-size="15" fill="#B45309" font-weight="700" text-anchor="start" letter-spacing="0">What stops you</text><path d="M490 112 l8 8 M498 112 l-8 8" stroke="#B45309" stroke-width="2.2" stroke-linecap="round"/><text x="514" y="121" font-size="13.5" fill="#5A6675" font-weight="400" text-anchor="start" letter-spacing="0">Years of sensor chemistry</text><path d="M490 142 l8 8 M498 142 l-8 8" stroke="#B45309" stroke-width="2.2" stroke-linecap="round"/><text x="514" y="151" font-size="13.5" fill="#5A6675" font-weight="400" text-anchor="start" letter-spacing="0">Calibration and MARD</text><path d="M490 172 l8 8 M498 172 l-8 8" stroke="#B45309" stroke-width="2.2" stroke-linecap="round"/><text x="514" y="181" font-size="13.5" fill="#5A6675" font-weight="400" text-anchor="start" letter-spacing="0">Tooling and lines</text><path d="M440 214 v21" stroke="#0B5FA5" stroke-width="2.5" stroke-linecap="round"/><path d="M440 244 l-6 -10 h12 z" fill="#0B5FA5"/><text x="56" y="288" font-size="11.5" fill="#8A97A6" font-weight="700" text-anchor="start" letter-spacing="1.1">THE SKD KIT CLOSES IT</text><rect x="56" y="306" width="178" height="74" rx="10" fill="#E3F0FA" stroke="#80BCE2" stroke-width="1.5"/><text x="145" y="350" font-size="13.5" fill="#0A4C84" font-weight="700" text-anchor="middle" letter-spacing="0">Sensor + transmitter</text><text x="242" y="350" font-size="19" fill="#8A97A6" font-weight="400" text-anchor="middle" letter-spacing="0">+</text><rect x="252" y="306" width="178" height="74" rx="10" fill="#E3F0FA" stroke="#80BCE2" stroke-width="1.5"/><text x="341" y="350" font-size="13.5" fill="#0A4C84" font-weight="700" text-anchor="middle" letter-spacing="0">Applicator</text><text x="438" y="350" font-size="19" fill="#8A97A6" font-weight="400" text-anchor="middle" letter-spacing="0">+</text><rect x="448" y="306" width="178" height="74" rx="10" fill="#E3F0FA" stroke="#80BCE2" stroke-width="1.5"/><text x="537" y="350" font-size="13.5" fill="#0A4C84" font-weight="700" text-anchor="middle" letter-spacing="0">Adhesive patch</text><text x="634" y="350" font-size="19" fill="#8A97A6" font-weight="400" text-anchor="middle" letter-spacing="0">+</text><rect x="644" y="306" width="178" height="74" rx="10" fill="#0B5FA5" stroke="#0A4C84" stroke-width="1.5"/><text x="733" y="350" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="middle" letter-spacing="0">Your branding</text></svg>