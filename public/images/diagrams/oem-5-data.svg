<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="DM Sans Variable, DM Sans, Inter, system-ui, sans-serif" role="img"><title>Data passes through the API into the partner platform, never into EverChek</title><text x="56" y="34" font-size="11.5" fill="#8A97A6" font-weight="700" text-anchor="start" letter-spacing="1.1">WHERE THE PATIENT DATA GOES</text><g transform="translate(120,140)"><circle r="34" fill="#E3F0FA" stroke="#0B5FA5" stroke-width="2.5"/><circle r="14" fill="#FFFFFF" stroke="#0B5FA5" stroke-width="2.5"/><path d="M0 14 v22" stroke="#0B5FA5" stroke-width="2.5" stroke-linecap="round"/></g><text x="120" y="214" font-size="14" fill="#0A4C84" font-weight="700" text-anchor="middle" letter-spacing="0">Sensor</text><path d="M178 140 h37" stroke="#0B5FA5" stroke-width="2.5" stroke-linecap="round"/><path d="M224 140 l-10 -6 v12 z" fill="#0B5FA5"/><rect x="238" y="104" width="178" height="74" rx="10" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1.5" stroke-dasharray="6 5"/><text x="327" y="136" font-size="14" fill="#5A6675" font-weight="700" text-anchor="middle" letter-spacing="0">EverChek API</text><text x="327" y="156" font-size="12.5" fill="#8A97A6" font-weight="400" text-anchor="middle" letter-spacing="0">transport only</text><path d="M430 140 h37" stroke="#0B5FA5" stroke-width="2.5" stroke-linecap="round"/><path d="M476 140 l-10 -6 v12 z" fill="#0B5FA5"/><rect x="490" y="88" width="334" height="106" rx="10" fill="#E3F0FA" stroke="#0B5FA5" stroke-width="2"/><text x="516" y="128" font-size="17" fill="#0A4C84" font-weight="700" text-anchor="start" letter-spacing="0">Your platform</text><text x="516" y="156" font-size="13.5" fill="#0A4C84" font-weight="400" text-anchor="start" letter-spacing="0">Every reading, trend and analysis</text><line x1="56" y1="248" x2="824" y2="248" stroke="#DDE3EA" stroke-width="1.5" stroke-dasharray="5 5"/><text x="56" y="288" font-size="11.5" fill="#8A97A6" font-weight="700" text-anchor="start" letter-spacing="1.1">YOU KEEP</text><path d="M59 314 l3.6 3.9 l7.6 -8.6" stroke="#0B7355" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="319" font-size="13.5" fill="#5A6675" font-weight="400" text-anchor="start" letter-spacing="0">Ownership of the data</text><path d="M59 346 l3.6 3.9 l7.6 -8.6" stroke="#0B7355" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="351" font-size="13.5" fill="#5A6675" font-weight="400" text-anchor="start" letter-spacing="0">The end-user relationship</text><path d="M59 378 l3.6 3.9 l7.6 -8.6" stroke="#0B7355" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="383" font-size="13.5" fill="#5A6675" font-weight="400" text-anchor="start" letter-spacing="0">Your own privacy policy</text><text x="486" y="288" font-size="11.5" fill="#8A97A6" font-weight="700" text-anchor="start" letter-spacing="1.1">WE NEVER</text><path d="M490 310 l8 8 M498 310 l-8 8" stroke="#B45309" stroke-width="2.2" stroke-linecap="round"/><text x="514" y="319" font-size="13.5" fill="#5A6675" font-weight="400" text-anchor="start" letter-spacing="0">Hold your patient data</text><path d="M490 342 l8 8 M498 342 l-8 8" stroke="#B45309" stroke-width="2.2" stroke-linecap="round"/><text x="514" y="351" font-size="13.5" fill="#5A6675" font-weight="400" text-anchor="start" letter-spacing="0">Contact your end users</text><path d="M490 374 l8 8 M498 374 l-8 8" stroke="#B45309" stroke-width="2.2" stroke-linecap="round"/><text x="514" y="383" font-size="13.5" fill="#5A6675" font-weight="400" text-anchor="start" letter-spacing="0">Analyse or resell it</text></svg>