rgin</text><text x="56" y="296" font-size="13.5" fill="#12181F" font-weight="700" text-anchor="start" letter-spacing="0">Registration</text><rect x="184" y="278" width="232" height="34" rx="8" fill="#EEF1F4" stroke="#DCE1E6" stroke-width="1.5"/><text x="300" y="300" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="middle" letter-spacing="0">held by the brand</text><path d="M424 295 h17" stroke="#8A97A6" stroke-width="2.5" stroke-linecap="round"/><path d="M450 295 l-10 -6 v12 z" fill="#8A97A6"/><rect x="470" y="278" width="250" height="34" rx="8" fill="#E3F0FA" stroke="#80BCE2" stroke-width="1.5"/><text x="595" y="300" font-size="12.5" fill="#0A4C84" font-weight="600" text-anchor="middle" letter-spacing="0">held by you</text><text x="56" y="346" font-size="13.5" fill="#12181F" font-weight="700" text-anchor="start" letter-spacing="0">Competition</text><rect x="184" y="328" width="232" height="34" rx="8" fill="#EEF1F4" stroke="#DCE1E6" stroke-width="1.5"/><text x="300" y="350" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="middle" letter-spacing="0">many sellers, one product</text><path d="M424 345 h17" stroke="#8A97A6" stroke-width="2.5" stroke-linecap="round"/><path d="M450 345 l-10 -6 v12 z" fill="#8A97A6"/><rect x="470" y="328" width="250" height="34" rx="8" fill="#E3F0FA" stroke="#80BCE2" stroke-width="1.5"/><text x="595" y="350" font-size="12.5" fill="#0A4C84" font-weight="600" text-anchor="middle" letter-spacing="0">only you sell it</text></svg>