<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="DM Sans Variable, DM Sans, Inter, system-ui, sans-serif" role="img"><title>Volume scales on one qualified line; the product does not change</title><text x="56" y="34" font-size="11.5" fill="#8A97A6" font-weight="700" text-anchor="start" letter-spacing="1.1">ONE QUALIFIED LINE, FROM PILOT TO COMMERCIAL VOLUME</text><rect x="56" y="240" width="176" height="96" rx="10" fill="#E3F0FA" stroke="#80BCE2" stroke-width="1.5"/><text x="144" y="293" font-size="13.5" fill="#0A4C84" font-weight="700" text-anchor="middle" letter-spacing="0">Pilot</text><path d="M234 300 h13" stroke="#0B5FA5" stroke-width="2.5" stroke-linecap="round"/><path d="M256 300 l-10 -6 v12 z" fill="#0B5FA5"/><rect x="262" y="186" width="176" height="150" rx="10" fill="#E3F0FA" stroke="#80BCE2" stroke-width="1.5"/><text x="350" y="266" font-size="13.5" fill="#0A4C84" font-weight="700" text-anchor="middle" letter-spacing="0">Validation batch</text><path d="M440 300 h13" stroke="#0B5FA5" stroke-width="2.5" stroke-linecap="round"/><path d="M462 300 l-10 -6 v12 z" fill="#0B5FA5"/><rect x="468" y="122" width="176" height="214" rx="10" fill="#E3F0FA" stroke="#80BCE2" stroke-width="1.5"/><text x="556" y="234" font-size="13.5" fill="#0A4C84" font-weight="700" text-anchor="middle" letter-spacing="0">Ramp-up</text><path d="M646 300 h13" stroke="#0B5FA5" stroke-width="2.5" stroke-linecap="round"/><path d="M668 300 l-10 -6 v12 z" fill="#0B5FA5"/><rect x="674" y="50" width="176" height="286" rx="10" fill="#0B5FA5" stroke="#0A4C84" stroke-width="1.5"/><text x="762" y="198" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="middle" letter-spacing="0">Commercial volume</text><line x1="56" y1="348" x2="824" y2="348" stroke="#DDE3EA" stroke-width="2"/><path d="M59 384 l3.6 3.9 l7.6 -8.6" stroke="#0B5FA5" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="389" font-size="1