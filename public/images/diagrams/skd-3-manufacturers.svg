<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="DM Sans Variable, DM Sans, Inter, system-ui, sans-serif" role="img"><title>Adding a CGM line to a plant that is already qualified</title><text x="56" y="34" font-size="11.5" fill="#8A97A6" font-weight="700" text-anchor="start" letter-spacing="1.1">YOUR PLANT ALREADY QUALIFIES</text><rect x="56" y="54" width="142" height="68" rx="10" fill="#E3F0FA" stroke="#80BCE2" stroke-width="1.5"/><text x="127" y="94" font-size="13.5" fill="#0A4C84" font-weight="600" text-anchor="middle" letter-spacing="0">Cleanroom</text><rect x="212" y="54" width="142" height="68" rx="10" fill="#E3F0FA" stroke="#80BCE2" stroke-width="1.5"/><text x="283" y="94" font-size="13.5" fill="#0A4C84" font-weight="600" text-anchor="middle" letter-spacing="0">Assembly line</text><rect x="368" y="54" width="142" height="68" rx="10" fill="#E3F0FA" stroke="#80BCE2" stroke-width="1.5"/><text x="439" y="94" font-size="13.5" fill="#0A4C84" font-weight="600" text-anchor="middle" letter-spacing="0">QA / QC lab</text><rect x="524" y="54" width="142" height="68" rx="10" fill="#E3F0FA" stroke="#80BCE2" stroke-width="1.5"/><text x="595" y="94" font-size="13.5" fill="#0A4C84" font-weight="600" text-anchor="middle" letter-spacing="0">Packaging</text><rect x="680" y="54" width="142" height="68" rx="10" fill="#E3F0FA" stroke="#80BCE2" stroke-width="1.5"/><text x="751" y="94" font-size="13.5" fill="#0A4C84" font-weight="600" text-anchor="middle" letter-spacing="0">Warehouse</text><text x="56" y="152" font-size="14" fill="#8A97A6" font-weight="400" text-anchor="start" letter-spacing="0">Qualified, staffed, paid for — and not fully loaded.</text><path d="M440 176 v25" stroke="#0B5FA5" stroke-width="2.5" stroke-linecap="round"/><path d="M440 210 l-6 -10 h12 z" fill="#0B5FA5"/><text x="56" y="244" font-size="11.5" fill="#8A97A6" font-weight="700" text-anchor="start" letter-spacing="1.1">ADD CGM AS A SECOND LINE</text><rect x="5